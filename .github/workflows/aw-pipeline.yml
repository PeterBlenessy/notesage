name: AW — Pipeline

# End-to-end AI dev-process pipeline triggered when a human opens or
# reopens an issue. Runs triage → refine → slice → matrix-tdd in one
# workflow with `needs:` dependencies, so each stage starts immediately
# after its predecessor without waiting for separate GH Actions trigger
# latency. Matrix at the tdd stage parallelizes implementation of afk
# subtasks (up to 3 in flight at once).
#
# This workflow handles the HAPPY PATH on user issue creation. The
# standalone workflows (aw-triage, aw-refine, aw-slice, aw-tdd) are
# the backstops — cron sweeps + workflow_dispatch + the post-research
# re-slice trigger on aw-slice.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write       # tdd needs to push branches
  issues: write
  pull-requests: write
  actions: write        # tdd dispatches aw-review.yml after the PR is created
  id-token: write       # claude-code-action OIDC

# NOTE: workflow-level concurrency removed in favor of per-job
# `aw-stage-{stage}-{issue}` groups (#98). The whole-pipeline group
# only blocked the SAME workflow file from running twice on one issue;
# it did NOT prevent the pipeline's slice job from racing with a sweep
# slice job for the same issue. Per-job groups, sharing keys with the
# sweep + standalones, do.

jobs:
  triage:
    # Author-association gate: only auto-process issues from trusted
    # authors (OWNER / COLLABORATOR / MEMBER), OR issues the owner has
    # explicitly opted-in by adding the `aw-approved` label. External
    # issues sit in the queue until the owner reviews and approves them.
    # See aw-mark-external.yml for the auto-labelling helper, and
    # `Choice: author-association gate for external issues` in
    # docs/agentic-workflow.md for the rationale.
    if: |
      github.event.issue.author_association == 'OWNER' ||
      github.event.issue.author_association == 'COLLABORATOR' ||
      github.event.issue.author_association == 'MEMBER' ||
      contains(github.event.issue.labels.*.name, 'aw-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Shared across pipeline / sweep / standalone — see aw-triage.yml.
      group: aw-stage-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      classified: ${{ steps.check.outputs.classified }}
    steps:
      - uses: actions/checkout@v6
      - name: Run aw-triage skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use GITHUB_TOKEN so the agent's gh calls (label changes, comments,
          # PR creation) trigger the built-in recursion guard — downstream
          # workflows listening on issues.labeled / issue_comment / pull_request
          # do NOT fire for our own actions. Bot identity becomes
          # github-actions[bot] (not claude[bot]).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --max-turns 50
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-triage` skill at `.claude/skills/aw-triage/SKILL.md`
            on issue #${{ github.event.issue.number }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely. Apply exactly one of `bug` / `enhancement` / `chore`,
            add `refine` (action label), or close as duplicate / wontfix
            per the skill rules.
      - name: Verify triage actually completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE=$(gh issue view ${{ github.event.issue.number }} --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue closed (duplicate/wontfix). Triage complete."
            exit 0
          fi
          LABELS=$(gh issue view ${{ github.event.issue.number }} --json labels --jq '[.labels[].name]')
          HAS_CATEGORY=$(echo "$LABELS" | jq -r 'any(. == "bug" or . == "enhancement" or . == "chore")')
          HAS_REFINE=$(echo "$LABELS" | jq -r 'any(. == "refine")')
          if [[ "$HAS_CATEGORY" != "true" ]] || [[ "$HAS_REFINE" != "true" ]]; then
            echo "::error::aw-triage agent exited cleanly but did NOT flip labels (category=$HAS_CATEGORY, refine=$HAS_REFINE). Likely ran out of --max-turns budget. Sweep cron will recover within 15 min."
            exit 1
          fi
      - name: Check classification
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE=$(gh issue view ${{ github.event.issue.number }} --json state --jq '.state')
          if [[ "$STATE" != "OPEN" ]]; then
            echo "Issue closed (probably as duplicate or wontfix). Stopping pipeline."
            echo "classified=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An issue counts as triaged iff it has a category label
          # (bug/enhancement/chore) AND the `refine` action label.
          LABELS=$(gh issue view ${{ github.event.issue.number }} --json labels --jq '[.labels[].name]')
          HAS_CATEGORY=$(echo "$LABELS" | jq 'any(. == "bug" or . == "enhancement" or . == "chore")')
          HAS_REFINE=$(echo "$LABELS" | jq 'any(. == "refine")')
          if [[ "$HAS_CATEGORY" == "true" ]] && [[ "$HAS_REFINE" == "true" ]]; then
            echo "classified=true" >> "$GITHUB_OUTPUT"
          else
            echo "classified=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Classified: category=$HAS_CATEGORY refine=$HAS_REFINE"

  refine:
    needs: triage
    if: needs.triage.outputs.classified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: aw-stage-refine-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
      - name: Run aw-refine skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use GITHUB_TOKEN so the agent's gh calls (label changes, comments,
          # PR creation) trigger the built-in recursion guard — downstream
          # workflows listening on issues.labeled / issue_comment / pull_request
          # do NOT fire for our own actions. Bot identity becomes
          # github-actions[bot] (not claude[bot]).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --max-turns 50
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-refine` skill at `.claude/skills/aw-refine/SKILL.md`
            on issue #${{ github.event.issue.number }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely. Add `refined` (state) + `slice` (action); remove
            `refine`. Pick the right template for the category.
      - name: Verify refine actually completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LABELS=$(gh issue view ${{ github.event.issue.number }} --json labels --jq '[.labels[].name]')
          HAS_SLICE=$(echo "$LABELS" | jq -r 'any(. == "slice")')
          HAS_REFINED=$(echo "$LABELS" | jq -r 'any(. == "refined")')
          if [[ "$HAS_SLICE" != "true" ]] || [[ "$HAS_REFINED" != "true" ]]; then
            echo "::error::aw-refine agent exited cleanly but did NOT flip labels (slice=$HAS_SLICE, refined=$HAS_REFINED). Likely ran out of --max-turns budget. Sweep cron will recover within 15 min."
            exit 1
          fi
      - name: Check ready-to-slice
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LABELS=$(gh issue view ${{ github.event.issue.number }} --json labels --jq '[.labels[].name]')
          HAS_SLICE=$(echo "$LABELS" | jq 'any(. == "slice")')
          echo "ready=$HAS_SLICE" >> "$GITHUB_OUTPUT"
          echo "Ready to slice: $HAS_SLICE"

  slice:
    needs: refine
    if: needs.refine.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: aw-stage-slice-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
      - name: Run aw-slice skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use GITHUB_TOKEN so the agent's gh calls (label changes, comments,
          # PR creation) trigger the built-in recursion guard — downstream
          # workflows listening on issues.labeled / issue_comment / pull_request
          # do NOT fire for our own actions. Bot identity becomes
          # github-actions[bot] (not claude[bot]).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-slice` skill at `.claude/skills/aw-slice/SKILL.md`
            on issue #${{ github.event.issue.number }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely. The unit is one user value = one PR. Default to NOT
            slicing — most issues pass directly to aw-tdd as a single PR.
            Slice only when the issue delivers N independent user values,
            each independently shippable. When splitting, the original
            issue becomes the FIRST peer slice (rewrite its body); create
            N-1 new peer issues for the remaining values (no GraphQL
            sub-issue link). If under-specified, create ONE research peer
            and set the original to `awaiting-research`.
      - name: Verify slice actually completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name]')
          HAS_TDD=$(echo "$LABELS" | jq -r 'any(. == "tdd")')
          HAS_AFK_OR_HITL=$(echo "$LABELS" | jq -r 'any(. == "afk" or . == "hitl")')
          HAS_AWAITING=$(echo "$LABELS" | jq -r 'any(. == "awaiting-research")')
          # Valid outcomes: (tdd + afk|hitl) OR awaiting-research OR issue was split
          # (peer issues now carry tdd; original may have been rewritten)
          if [[ "$HAS_AWAITING" == "true" ]]; then
            echo "Slice set awaiting-research. OK."
            exit 0
          fi
          if [[ "$HAS_TDD" == "true" && "$HAS_AFK_OR_HITL" == "true" ]]; then
            echo "Slice set tdd + afk/hitl. OK."
            exit 0
          fi
          # Check if the issue was sliced (original rewritten as peer slice 1)
          HAS_SLICE=$(echo "$LABELS" | jq -r 'any(. == "slice")')
          if [[ "$HAS_SLICE" == "false" ]]; then
            echo "::error::aw-slice agent exited cleanly but did NOT produce a valid outcome (tdd=$HAS_TDD, afk/hitl=$HAS_AFK_OR_HITL, awaiting-research=$HAS_AWAITING). Likely ran out of --max-turns budget. Sweep cron will recover within 15 min."
            exit 1
          fi
      - name: Check if original issue is ready for tdd
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # The issue is tdd-ready iff aw-slice put `tdd + afk` on it
          # (don't-slice path, OR the first peer slice in a split).
          # awaiting-research / hitl / no tdd label → tdd job is skipped.
          # Peer issues created by a split run through their own pipeline
          # via the standalone aw-tdd cron when they enter the queue.
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name]')
          HAS_TDD=$(echo "$LABELS" | jq 'any(. == "tdd")')
          HAS_AFK=$(echo "$LABELS" | jq 'any(. == "afk")')
          if [[ "$HAS_TDD" == "true" && "$HAS_AFK" == "true" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  tdd:
    needs: slice
    if: needs.slice.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aw-stage-tdd-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # WORKFLOW_PAT — the tdd job opens PRs and may push edits to
          # .github/workflows/, which GITHUB_TOKEN can't write to. See
          # "Choice: WORKFLOW_PAT for bot-PR CI gating" in
          # docs/agentic-workflow.md.
          token: ${{ secrets.WORKFLOW_PAT }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run aw-tdd skill
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use WORKFLOW_PAT for the tdd job specifically — the bot-authored
          # PR it creates needs to fire `pull_request` events to run CI.
          # GITHUB_TOKEN's recursion guard suppresses those events.
          # The other stages in this pipeline (triage / refine / slice)
          # don't open PRs and stay on GITHUB_TOKEN.
          github_token: ${{ secrets.WORKFLOW_PAT }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --max-turns 200
            --allowedTools "Bash,Edit,Write,Read,Grep,Glob"
          prompt: |
            Run the `aw-tdd` skill at `.claude/skills/aw-tdd/SKILL.md` on
            issue #${{ github.event.issue.number }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            Hard gates: red tests must be RED before implementation; full
            `pnpm test` and `pnpm typecheck` must pass; only the files
            listed in the subtask body may be modified. Open the PR as
            DRAFT (`gh pr create --draft`). Re-add `afk` on any failure.
      - name: Verify tdd actually completed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name]')
          HAS_REVIEW=$(echo "$LABELS" | jq -r 'any(. == "review")')
          if [[ "$HAS_REVIEW" == "true" ]]; then
            echo "aw-tdd opened a PR and set review label. OK."
            exit 0
          fi
          # Also accept if a draft PR referencing this issue already exists
          # (label write can have latency; PR existence is authoritative).
          PR_COUNT=$(gh pr list --search "fixes #$ISSUE OR resolves #$ISSUE" --state open --json number --jq 'length')
          if [[ "$PR_COUNT" -gt 0 ]]; then
            echo "aw-tdd opened a PR (found $PR_COUNT). OK."
            exit 0
          fi
          echo "::error::aw-tdd agent exited cleanly but did NOT open a PR or set the review label (review=$HAS_REVIEW, open PRs=$PR_COUNT). Likely ran out of --max-turns budget or hit a hard gate. Sweep cron will recover within 15 min."
          exit 1
