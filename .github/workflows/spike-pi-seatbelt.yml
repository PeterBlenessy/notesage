# Manually-dispatched macOS execution of the pi Seatbelt spike (task #2 of
# docs/tasks/2026-07-29-pi-local-agent-preset-tasks.md). Linux agent sessions
# author the harness; this workflow is the macOS half. Record the run's output
# in docs/research/2026-07-29-pi-spikes.md.
name: Spike — pi under Seatbelt

on:
  workflow_dispatch:
    inputs:
      pi_version:
        description: "pi release version to test (no leading v)"
        required: false
        default: "0.80.6"

jobs:
  seatbelt-spike:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run Seatbelt spike
        env:
          PI_VERSION: ${{ inputs.pi_version }}
        run: |
          chmod +x scripts/spikes/pi-seatbelt-spike.sh
          WORK_DIR="$RUNNER_TEMP/pi-seatbelt" scripts/spikes/pi-seatbelt-spike.sh 2>&1 | tee spike-output.log

      - name: Upload spike output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-seatbelt-spike-output
          path: |
            spike-output.log
            ${{ runner.temp }}/pi-seatbelt/stub.log
            ${{ runner.temp }}/pi-seatbelt/marker-*.txt
          if-no-files-found: warn
          retention-days: 14
