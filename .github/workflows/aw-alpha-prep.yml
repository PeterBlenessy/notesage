name: AW — Alpha Prep (Tier Classifier)

# Classifies a bot-authored PR into Tier A / B / C after aw-review approves
# it (i.e. flips it from draft → ready). The tier label gates downstream
# automation:
#
#   - tier:A — auto-merge on green CI (`aw-merge.yml` enables `gh pr merge --auto`)
#   - tier:B — batched merge in periodic alpha cuts (manual or cron)
#   - tier:C — sits at ready, waits for human review/merge (visual or
#               load-bearing subsystem changes)
#
# Classification rules (single source of truth — keep in sync with
# `feedback_user_facing_release_notes.md` and the auto-release framework
# discussion in 2026-05-15):
#
#   Tier C if ANY of:
#     - Originating issue has `hitl` or `visual` label
#     - Files touched include `**/acp*.rs`, `**/sandbox*.rs`, `**/credentials.rs`,
#       `**/watcher.rs`, `**/index/**`, `**/file.rs`, `**/extensions/*.ts`,
#       `**/editor-store.ts`, `**.github/workflows/**`
#     - Diff > 250 lines OR > 8 files
#
#   Tier B if NONE of the above AND ANY of:
#     - Diff > 100 lines OR > 3 files
#     - New feature (acceptance criteria mention new behaviour)
#
#   Tier A otherwise.

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to classify (optional — skips event filter)"
        required: false

permissions:
  contents: read
  pull-requests: write    # add tier label
  issues: read            # read originating issue's labels

concurrency:
  group: aw-alpha-prep-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  classify:
    # Only act on bot-authored PRs (branch prefix `claude/*`). Skip
    # human-authored PRs entirely — they're outside the AW pipeline.
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Classify PR into Tier A / B / C
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail

          # Load PR metadata.
          pr_json=$(gh pr view "$PR_NUMBER" --json additions,deletions,changedFiles,files,closingIssuesReferences,headRefName,labels,isDraft,state)

          additions=$(echo "$pr_json" | jq -r '.additions')
          changed_files=$(echo "$pr_json" | jq -r '.changedFiles')
          file_paths=$(echo "$pr_json" | jq -r '.files[].path')
          issue_numbers=$(echo "$pr_json" | jq -r '.closingIssuesReferences[].number // empty')
          pr_labels=$(echo "$pr_json" | jq -r '.labels[].name // empty')
          is_draft=$(echo "$pr_json" | jq -r '.isDraft')
          pr_state=$(echo "$pr_json" | jq -r '.state')

          echo "PR #$PR_NUMBER: $additions+ / $changed_files files / state=$pr_state / draft=$is_draft"

          # Guard: bail if PR is closed/merged or back to draft.
          if [[ "$pr_state" != "OPEN" || "$is_draft" == "true" ]]; then
            echo "PR is $pr_state (draft=$is_draft) — no classification."
            exit 0
          fi

          # Guard: don't re-classify if a tier label is already present.
          if echo "$pr_labels" | grep -qE '^tier:[ABC]$'; then
            existing=$(echo "$pr_labels" | grep -E '^tier:[ABC]$')
            echo "Already classified: $existing — no-op."
            exit 0
          fi

          tier="A"
          reason=""

          # ----- Tier C: visual / hitl flags on originating issue -----
          for n in $issue_numbers; do
            issue_labels=$(gh issue view "$n" --json labels --jq '.labels[].name' || echo "")
            if echo "$issue_labels" | grep -qE '^(hitl|visual)$'; then
              tier="C"
              reason="Originating issue #$n has label 'hitl' or 'visual'"
              break
            fi
          done

          # ----- Tier C: load-bearing files touched -----
          # Reading from a single string with grep -E is faster than per-file globs.
          if [[ "$tier" != "C" ]]; then
            if echo "$file_paths" | grep -qE '(/acp.*\.rs$|/sandbox.*\.rs$|/credentials\.rs$|/watcher\.rs$|/index/|/file\.rs$|editor-store\.ts$|/extensions/.*\.ts$|^\.github/workflows/)'; then
              tier="C"
              reason="Touches load-bearing file(s): $(echo "$file_paths" | grep -E '(/acp.*\.rs$|/sandbox.*\.rs$|/credentials\.rs$|/watcher\.rs$|/index/|/file\.rs$|editor-store\.ts$|/extensions/.*\.ts$|^\.github/workflows/)' | head -3 | tr '\n' ' ')"
            fi
          fi

          # ----- Tier C: oversized diff -----
          if [[ "$tier" != "C" ]] && { (( additions > 250 )) || (( changed_files > 8 )); }; then
            tier="C"
            reason="Diff exceeds Tier-B ceiling (>$additions lines or >$changed_files files; ceiling 250/8)"
          fi

          # ----- Tier B: mid-size or feature-shaped -----
          if [[ "$tier" == "A" ]] && { (( additions > 100 )) || (( changed_files > 3 )); }; then
            tier="B"
            reason="Mid-size diff ($additions lines, $changed_files files; Tier-A ceiling 100/3)"
          fi

          # ----- Tier A default -----
          if [[ "$tier" == "A" ]]; then
            reason="Small, safe-subsystem, no hitl/visual flag; $additions lines, $changed_files files"
          fi

          # Apply label.
          label="tier:$tier"
          echo "Classified: $label  ($reason)"
          gh pr edit "$PR_NUMBER" --add-label "$label"

          # Post a one-line comment summarising the classification — visible
          # in the PR timeline for human review.
          comment_body=$(cat <<EOF
          🧮 **aw-alpha-prep:** \`$label\` — $reason

          Auto-merge eligibility:
          - **tier:A** → enabled by \`aw-merge\` workflow; merges automatically when CI is green.
          - **tier:B** → queued for batched merge in next alpha cut (manual or cron).
          - **tier:C** → sits at ready; waits for human review.
          EOF
          )
          gh pr comment "$PR_NUMBER" --body "$comment_body"
