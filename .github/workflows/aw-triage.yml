name: AW — Triage

# Classifies untriaged GitHub issues using the aw-triage skill at
# .claude/skills/aw-triage/SKILL.md. The happy path runs from
# aw-pipeline.yml on issues.opened. This standalone workflow is the
# backstop: cron sweeps untriaged issues every 15 minutes and
# workflow_dispatch lets you re-trigger manually.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific issue number to triage (optional — defaults to first eligible)"
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write   # claude-code-action uses OIDC for auth telemetry

concurrency:
  group: aw-triage-${{ inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Precheck: find untriaged top-level issues. An issue is untriaged
      # iff it has no category label (bug/enhancement/chore) AND no
      # already-classified state (duplicate/wontfix/feature) AND is open.
      # The `feature` label means aw-triage has already run.
      - name: Find candidates
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.issue_number }}" ]]; then
            echo "candidates=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ISSUES=$(gh issue list \
            --state open \
            --limit 10 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "bug" or . == "enhancement" or . == "chore" or . == "duplicate" or . == "wontfix")) | not) | .number] | first(.[])? // empty')
          if [[ -z "$ISSUES" ]]; then
            echo "No untriaged issues. Skipping LLM step."
            echo "candidates=" >> "$GITHUB_OUTPUT"
          else
            echo "Found candidate: #$ISSUES"
            echo "candidates=$ISSUES" >> "$GITHUB_OUTPUT"
          fi

      - name: Run aw-triage skill
        if: steps.find.outputs.candidates != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See aw-pipeline.yml for the rationale: GITHUB_TOKEN triggers the
          # built-in recursion guard so the agent's gh calls don't spawn
          # downstream skipped runs. Bot identity becomes github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-triage` skill at `.claude/skills/aw-triage/SKILL.md`
            on issue #${{ steps.find.outputs.candidates }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            **Hard constraints** (also defined in the skill):
            - Apply exactly one of `bug` / `enhancement` / `chore`.
            - Add `feature` (parent marker) and `refine` (action label).
            - Do not modify the issue title or body.
            - Use `gh issue close --reason duplicate` only when closing as a
              duplicate of another open issue.
            - Idempotent: if `feature` is already set, exit silently.
