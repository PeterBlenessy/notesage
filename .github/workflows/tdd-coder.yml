name: TDD coder

# Implements `afk + planned` subtask issues using the tdd-coder skill at
# .claude/skills/tdd-coder/SKILL.md. Writes failing tests first, implements
# minimum to pass, runs the full test suite as a hard gate, opens a draft PR.
# Triggers when a subtask gets the `afk` label (from subtask-planner) plus
# a 15-minute backstop sweep. One subtask per run.

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific issue number to implement (optional — defaults to first eligible)"
        required: false

permissions:
  contents: write       # push branch
  pull-requests: write  # open draft PR
  issues: write         # update labels, post comments
  id-token: write       # claude-code-action OIDC

concurrency:
  # Per-issue: prevent two runs on the same subtask. Different subtasks
  # can run in parallel.
  group: tdd-coder-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so the agent can rebase / branch

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Precheck: find one eligible subtask. Triggers from `issues.labeled`
      # event come pre-targeted; cron picks the oldest eligible.
      - name: Find candidate
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.issue_number }}" ]]; then
            echo "candidate=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            ISSUE="${{ github.event.issue.number }}"
            LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name]')
            HAS_CATEGORY=$(echo "$LABELS" | jq 'any(. == "bug" or . == "enhancement" or . == "chore")')
            HAS_AFK=$(echo "$LABELS" | jq 'any(. == "afk")')
            HAS_ENHANCED=$(echo "$LABELS" | jq 'any(. == "enhanced")')
            HAS_BUSY=$(echo "$LABELS" | jq 'any(. == "in-progress" or . == "in-review")')
            if [[ "$HAS_CATEGORY" != "true" ]] || [[ "$HAS_AFK" != "true" ]] || [[ "$HAS_ENHANCED" != "true" ]] || [[ "$HAS_BUSY" == "true" ]]; then
              echo "Issue #$ISSUE not eligible (category=$HAS_CATEGORY afk=$HAS_AFK enhanced=$HAS_ENHANCED busy=$HAS_BUSY). Skipping."
              echo "candidate=" >> "$GITHUB_OUTPUT"
            else
              echo "candidate=$ISSUE" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # Cron / dispatch: oldest eligible afk + planned + category, not busy
          ISSUE=$(gh issue list \
            --label afk \
            --label enhanced \
            --state open \
            --limit 10 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "bug" or . == "enhancement" or . == "chore")) and ([.labels[].name] | any(. == "in-progress" or . == "in-review") | not)) | .number] | first // empty')
          if [[ -z "$ISSUE" ]]; then
            echo "No eligible subtasks. Skipping LLM step."
            echo "candidate=" >> "$GITHUB_OUTPUT"
          else
            echo "Found candidate: #$ISSUE"
            echo "candidate=$ISSUE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tdd-coder skill
        if: steps.find.outputs.candidate != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 200
            --allowedTools "Bash,Edit,Write,Read,Grep,Glob"
          prompt: |
            Run the `tdd-coder` skill at `.claude/skills/tdd-coder/SKILL.md`.
            Read the skill in full and follow it precisely. The skill defines
            the lifecycle, hard gates, and templates.

            **Trigger context**
            - Event: ${{ github.event_name }}
            - Repository: ${{ github.repository }}
            - Owner / Repo: PeterBlenessy / notesage
            - Subtask to implement: #${{ steps.find.outputs.candidate }}

            Implement that one subtask end-to-end. Follow the skill's
            red-green-refactor process precisely. Open a draft PR if and
            only if every hard gate passes.

            **Hard constraints** (also defined in the skill):
            - Verify red tests were red BEFORE writing any implementation.
            - Run `pnpm test` and `pnpm typecheck` before opening the PR.
            - Open the PR as DRAFT (`gh pr create --draft`). Never `--ready`.
            - Branch name: `claude/<short-description>-<issue-number>` style.
            - On any gate failure: revert local changes, restore label to `afk`,
              post a failure comment, exit. Do NOT force a partial PR.
            - Do not modify files outside the subtask's "Files likely to change"
              list (plus their tests). Unrelated changes are an abort condition.
            - Update issue labels through the lifecycle: start → in-progress;
              PR opened → in-review; failure → restore afk.
            - Reference the parent issue and ALL siblings before you decide what
              to read. The subtask body says `for #N` — N is the parent.
