name: AW — Refine

# Rewrites refine-flagged issues into the outcome-oriented template
# using the aw-refine skill at .claude/skills/aw-refine/SKILL.md.
# The cron sweep was consolidated into aw-sweep.yml; the issues.labeled
# trigger was also moved there (one Actions tile per human label edit
# instead of N skipped). This standalone now exists ONLY as a
# workflow_dispatch entry point — used by aw-feedback after a label
# flip and for manual one-off re-refinement.
# The happy path runs from aw-pipeline.yml.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific issue number to refine (optional — defaults to first eligible)"
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  # Shared `aw-stage-{stage}-{issue}` group across all entry points — see
  # aw-triage.yml for the rationale (#98 cross-workflow race fix).
  group: aw-stage-refine-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Precheck: find issues with the `refine` action label that haven't
      # been refined yet (no `refined` state marker). Event triggers
      # target the specific issue whose label was just added.
      - name: Find candidates
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.issue_number }}" ]]; then
            echo "candidates=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            echo "candidates=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ISSUES=$(gh issue list \
            --label refine \
            --state open \
            --limit 5 \
            --json number,labels \
            --jq '[.[] | select([.labels[].name] | any(. == "refined") | not) | .number] | first(.[])? // empty')
          if [[ -z "$ISSUES" ]]; then
            echo "No clarification candidates. Skipping LLM step."
            echo "candidates=" >> "$GITHUB_OUTPUT"
          else
            echo "Found candidate: #$ISSUES"
            echo "candidates=$ISSUES" >> "$GITHUB_OUTPUT"
          fi

      - name: Run aw-refine skill
        if: steps.find.outputs.candidates != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See aw-pipeline.yml for the rationale.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-refine` skill at `.claude/skills/aw-refine/SKILL.md`
            on issue #${{ steps.find.outputs.candidates }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            **Hard constraints** (also defined in the skill):
            - Verify the issue has exactly one of `bug` / `enhancement` / `chore`
              and the `refine` action label.
            - Pick the right template for the category.
            - Preserve all reproduction steps, error messages, technical details verbatim.
            - Add `refined` (state) + `slice` (action) after rewriting body.
              Remove `refine` (the action label that triggered this).
            - Do NOT modify the title unless it is genuinely not outcome-shaped.
            - Idempotent: if `refined` is already present, exit silently.
