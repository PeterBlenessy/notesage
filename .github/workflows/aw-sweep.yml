name: AW — Sweep

# Single cron-driven sweep that does the work the four standalones used
# to do via individual `schedule:` triggers. One workflow run per tick,
# four parallel stages (triage / refine / slice / tdd) — each stage is
# split into a `find_<stage>` job that runs a cheap `gh + jq` precheck
# and outputs the candidate issue number, and a `<stage>` job that runs
# the skill (gated on `needs.find_<stage>.outputs.candidate != ''`).
#
# Why the find/skill split: the per-stage concurrency group needs to
# reference the candidate issue number to share a key with the pipeline
# job and the standalone for that same stage+issue (#98). GitHub
# evaluates `concurrency:` at JOB level using `needs.*` outputs only —
# `steps.*.outputs.*` from the same job is NOT available at concurrency
# evaluation time. Splitting each stage into find + skill jobs makes the
# candidate available via `needs.find_<stage>.outputs.candidate` for the
# skill job's concurrency expression.
#
# The standalone workflows (aw-triage.yml, aw-refine.yml, aw-slice.yml,
# aw-tdd.yml) are `workflow_dispatch`-only manual entry points. The
# sweep is the auto-trigger backstop: cron every 15 min PLUS
# `issues.labeled/unlabeled` for instant-pickup on label edits.
# aw-pipeline.yml fires on issues.opened / reopened for the happy-path
# fan-through.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  # Also fire on every label edit. The four parallel precheck jobs each
  # filter for their own label state — only the matching one (if any)
  # runs the skill, the others exit in ~5s. Net: one Actions tile per
  # human label edit instead of three skipped tiles from the four
  # standalones each carrying their own `issues.labeled` trigger.
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: write       # tdd needs to push branches
  issues: write
  pull-requests: write
  actions: write        # tdd dispatches aw-review.yml after the PR is created
  id-token: write       # claude-code-action OIDC

# Workflow-level concurrency — scoped to the triggering issue (#103).
#
# When `gh issue edit --add-label tdd --remove-label slice` fires, GitHub
# emits TWO events (one `labeled` and one `unlabeled`) which can trigger
# two concurrent sweep runs. Scoping the group to the issue number collapses
# those into a single slot; `cancel-in-progress: true` cancels the second
# run since it delivers no new information.
#
# For cron ticks (no issue.number) the fallback to `github.run_id` keeps
# each cron run in its own slot — cron sweeps are independent and should
# never cancel each other.
#
# The per-skill-job concurrency groups (aw-stage-{stage}-{candidate}) are
# RETAINED unchanged — they guard cross-workflow races between the pipeline,
# sweep, and standalone workflows for the same issue+stage (#98). This
# workflow-level block only prevents duplicate SWEEP runs for the same issue.
concurrency:
  group: aw-sweep-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── triage ────────────────────────────────────────────────────────────────
  find_triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.find.outputs.candidate }}
    steps:
      # Untriaged = open + no category (bug/enhancement/chore) and not
      # already a closed-state marker (duplicate/wontfix). Once a category
      # is set, aw-triage has run on this issue.
      - name: Find candidate
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Filter out external-but-not-approved issues. The author-association
          # gate (aw-mark-external.yml) labels untrusted-author issues as
          # `external`. Owner reviews and adds `aw-approved` to opt them in.
          # See `Choice: author-association gate for external issues` in
          # docs/agentic-workflow.md.
          CAND=$(gh issue list \
            --repo PeterBlenessy/notesage \
            --state open \
            --limit 10 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "bug" or . == "enhancement" or . == "chore" or . == "duplicate" or . == "wontfix")) | not) | select(([.labels[].name] | any(. == "external") | not) or ([.labels[].name] | any(. == "aw-approved"))) | .number] | first(.[])? // empty')
          if [[ -z "$CAND" ]]; then
            echo "No untriaged issues (or all eligible candidates are external+unapproved). Skipping LLM step."
            echo "candidate=" >> "$GITHUB_OUTPUT"
          else
            echo "Found triage candidate: #$CAND"
            echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          fi

  triage:
    needs: find_triage
    if: needs.find_triage.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # Shared `aw-stage-{stage}-{issue}` group across pipeline / sweep /
      # standalone (#98). Falls back to run_id when candidate is empty so
      # this expression never evaluates to a malformed key.
      group: aw-stage-triage-${{ needs.find_triage.outputs.candidate || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Run aw-triage skill
        uses: anthropics/claude-code-action@v1
        with:
          model: claude-haiku-4-5-20251001   # triage: pattern-match classification, reversible
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See aw-pipeline.yml for the rationale: GITHUB_TOKEN triggers the
          # built-in recursion guard so the agent's gh calls don't spawn
          # downstream skipped runs. Bot identity becomes github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 50
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-triage` skill at `.claude/skills/aw-triage/SKILL.md`
            on issue #${{ needs.find_triage.outputs.candidate }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            **Hard constraints** (also defined in the skill):
            - Apply exactly one of `bug` / `enhancement` / `chore`.
            - Add `refine` (action label) so the next sweep tick picks it up.
            - Do not modify the issue title or body.
            - Use `gh issue close --reason duplicate` only when closing as a
              duplicate of another open issue.
            - Idempotent: if a category is already set, exit silently.

  # ── refine ────────────────────────────────────────────────────────────────
  find_refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.find.outputs.candidate }}
    steps:
      # Refine candidate = open + `refine` label + NOT yet `refined`.
      - name: Find candidate
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same external-author gate as the triage precheck above.
          CAND=$(gh issue list \
            --repo PeterBlenessy/notesage \
            --label refine \
            --state open \
            --limit 5 \
            --json number,labels \
            --jq '[.[] | select([.labels[].name] | any(. == "refined") | not) | select(([.labels[].name] | any(. == "external") | not) or ([.labels[].name] | any(. == "aw-approved"))) | .number] | first(.[])? // empty')
          if [[ -z "$CAND" ]]; then
            echo "No refine candidates (or all are external+unapproved). Skipping LLM step."
            echo "candidate=" >> "$GITHUB_OUTPUT"
          else
            echo "Found refine candidate: #$CAND"
            echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          fi

  refine:
    needs: find_refine
    if: needs.find_refine.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: aw-stage-refine-${{ needs.find_refine.outputs.candidate || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Run aw-refine skill
        uses: anthropics/claude-code-action@v1
        with:
          model: claude-opus-4-7             # refine: writes the spec — wrong here = wrong everywhere
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See aw-pipeline.yml for the rationale.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 50
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-refine` skill at `.claude/skills/aw-refine/SKILL.md`
            on issue #${{ needs.find_refine.outputs.candidate }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            **Hard constraints** (also defined in the skill):
            - Verify the issue has exactly one of `bug` / `enhancement` / `chore`
              and the `refine` action label.
            - Pick the right template for the category.
            - Preserve all reproduction steps, error messages, technical details verbatim.
            - Add `refined` (state) + `slice` (action) after rewriting body.
              Remove `refine` (the action label that triggered this).
            - Do NOT modify the title unless it is genuinely not outcome-shaped.
            - Idempotent: if `refined` is already present, exit silently.

  # ── slice ─────────────────────────────────────────────────────────────────
  find_slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.find.outputs.candidate }}
    steps:
      # Slice candidate = open + `slice` + `refined` AND NOT `sliced` /
      # `awaiting-research`.
      - name: Find candidate
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same external-author gate as the triage precheck above.
          CAND=$(gh issue list \
            --repo PeterBlenessy/notesage \
            --label slice \
            --label refined \
            --state open \
            --limit 5 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "sliced" or . == "awaiting-research")) | not) | select(([.labels[].name] | any(. == "external") | not) or ([.labels[].name] | any(. == "aw-approved"))) | .number] | first(.[])? // empty')
          if [[ -z "$CAND" ]]; then
            echo "No slicing candidates. Skipping LLM step."
            echo "candidate=" >> "$GITHUB_OUTPUT"
          else
            echo "Found slice candidate: #$CAND"
            echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          fi

  slice:
    needs: find_slice
    if: needs.find_slice.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: aw-stage-slice-${{ needs.find_slice.outputs.candidate || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Run aw-slice skill
        uses: anthropics/claude-code-action@v1
        with:
          model: claude-opus-4-7             # slice: architectural judgment, defines PR strategy
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See aw-pipeline.yml for the rationale.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-slice` skill at `.claude/skills/aw-slice/SKILL.md`
            on issue #${{ needs.find_slice.outputs.candidate }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely. The unit is one user value = one PR. Default to NOT
            slicing — most issues pass directly to aw-tdd as a single PR.
            Slice only when the issue delivers N independent user values,
            each independently shippable. When splitting, the original
            issue becomes the FIRST peer slice (rewrite its body); create
            N-1 new peer issues for the remaining values (no GraphQL
            sub-issue link). If under-specified, create ONE research peer
            and set the original to `awaiting-research`.

            **Hard constraints** (also defined in the skill):
            - Idempotent: if parent has `sliced` or `awaiting-research`
              already, exit silently.

  # ── tdd ───────────────────────────────────────────────────────────────────
  find_tdd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.find.outputs.candidate }}
    steps:
      # TDD candidate = open + `tdd` + `afk` + `refined` + a category,
      # AND not yet `review`.
      - name: Find candidate
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same external-author gate as the triage precheck above.
          CAND=$(gh issue list \
            --repo PeterBlenessy/notesage \
            --label tdd \
            --label afk \
            --label refined \
            --state open \
            --limit 10 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "review")) | not) | select(([.labels[].name] | any(. == "external") | not) or ([.labels[].name] | any(. == "aw-approved"))) | .number] | first(.[])? // empty')
          if [[ -z "$CAND" ]]; then
            echo "No tdd candidates (or all are external+unapproved). Skipping LLM step."
            echo "candidate=" >> "$GITHUB_OUTPUT"
          else
            echo "Found tdd candidate: #$CAND"
            echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          fi

  tdd:
    needs: find_tdd
    if: needs.find_tdd.outputs.candidate != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: aw-stage-tdd-${{ needs.find_tdd.outputs.candidate || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # WORKFLOW_PAT — same rationale as aw-pipeline.yml's tdd job:
          # the bot-authored PR needs to fire `pull_request` events for CI.
          token: ${{ secrets.WORKFLOW_PAT }}

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select model (escalate to Opus after 2 failures)
        id: model_select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ needs.find_tdd.outputs.candidate }}
        run: |
          set -euo pipefail
          ATTEMPTS=$(gh issue view "$ISSUE" --json comments \
            --jq '[.comments[] | select(.body | startswith("> *Starting implementation"))] | length')
          if [[ "$ATTEMPTS" -ge 2 ]]; then
            echo "model=claude-opus-4-7" >> "$GITHUB_OUTPUT"
            echo "TDD attempt $((ATTEMPTS+1)) — escalating to Opus"
          else
            echo "model=claude-sonnet-4-6" >> "$GITHUB_OUTPUT"
            echo "TDD attempt $((ATTEMPTS+1)) — using Sonnet"
          fi

      - name: Run aw-tdd skill
        uses: anthropics/claude-code-action@v1
        with:
          model: ${{ steps.model_select.outputs.model }}   # sonnet default; escalates to opus after 2 failures
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # WORKFLOW_PAT — same rationale as aw-pipeline.yml's tdd job.
          github_token: ${{ secrets.WORKFLOW_PAT }}
          claude_args: |
            --max-turns 200
            --allowedTools "Bash,Edit,Write,Read,Grep,Glob"
          prompt: |
            Run the `aw-tdd` skill at `.claude/skills/aw-tdd/SKILL.md` on
            issue #${{ needs.find_tdd.outputs.candidate }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            **Hard gates**: red tests must be RED before implementation; full
            `pnpm test` and `pnpm typecheck` must pass; only the files listed
            in the issue body may be modified. Open the PR as DRAFT
            (`gh pr create --draft`). The PR body's first line MUST be
            `Fixes #N` (bug) or `Resolves #N` (enhancement / chore) — these
            are GitHub's auto-close keywords. On any failure, re-add `afk`
            and post the failure comment.
