name: WF — Triage

# Classifies fresh GitHub issues using the wf-triage skill at
# .claude/skills/wf-triage/SKILL.md. Runs on every new issue and as
# a 15-minute backstop sweep for anything the event-trigger missed.

on:
  issues:
    types: [opened, reopened, edited]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write   # claude-code-action uses OIDC for auth telemetry

concurrency:
  group: wf-triage-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Precheck: figure out which issues to process. For event triggers,
      # the issue number comes from the payload. For cron / dispatch,
      # we query for `needs-triage` issues that don't yet have a category
      # label. Empty result => skip the LLM step entirely (zero token cost).
      - name: Find candidates
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Filter: skip issues that already have any of these labels
          ALREADY_CLASSIFIED='bug|enhancement|chore|duplicate|wontfix'
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            ISSUE="${{ github.event.issue.number }}"
            EXISTING=$(gh issue view "$ISSUE" --json labels \
              --jq "[.labels[].name | select(test(\"^($ALREADY_CLASSIFIED)$\"))] | length")
            if [[ "$EXISTING" -gt 0 ]]; then
              echo "Issue #$ISSUE already classified. Skipping LLM step (true idempotency)."
              echo "candidates=" >> "$GITHUB_OUTPUT"
            else
              echo "candidates=$ISSUE" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          ISSUES=$(gh issue list \
            --label needs-triage \
            --state open \
            --limit 5 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "bug" or . == "enhancement" or . == "chore")) | not) | .number] | join(",")')
          if [[ -z "$ISSUES" ]]; then
            echo "No untriaged issues. Skipping LLM step."
            echo "candidates=" >> "$GITHUB_OUTPUT"
          else
            echo "Found candidates: $ISSUES"
            echo "candidates=$ISSUES" >> "$GITHUB_OUTPUT"
          fi

      - name: Run wf-triage skill
        if: steps.find.outputs.candidates != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `wf-triage` skill at `.claude/skills/wf-triage/SKILL.md`.
            Read the skill in full and follow it precisely — it is the source of
            truth for classification rules, comment templates, and idempotency.

            **Trigger context**
            - Event: ${{ github.event_name }}
            - Repository: ${{ github.repository }}
            - Issues to triage (comma-separated): ${{ steps.find.outputs.candidates }}

            For each issue number in the list above, run the skill once. Process
            oldest first (lowest number first). Stop when all are done.

            **Hard constraints** (also defined in the skill):
            - Apply at most one of `bug` / `enhancement` / `chore` per issue.
            - Keep `needs-triage` after classification — the next workflow
              (`wf-clarify`) flips it to `enhanced`.
            - Do not modify the issue title or body.
            - Use `gh issue close --reason duplicate` only when closing as a
              duplicate of another open issue.
            - Idempotent: running twice produces the same result. The
              precheck above already filters out classified issues — if you
              somehow receive one anyway, exit silently without commenting.
