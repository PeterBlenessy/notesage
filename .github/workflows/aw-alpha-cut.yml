name: AW — Alpha Cut (periodic)

# Cuts a new alpha tag when conditions are met:
#   - At least one Tier-A or Tier-B PR has merged to main since the last
#     alpha tag.
#   - The most recent `Real Tauri E2E Tests` job on main is green AND
#     finished within the last 24h.
#   - No open PRs with the `tier:C` label are waiting on human review.
#     (Tier C work should land in its own release cycle, not be silently
#     skipped by an auto alpha.)
#
# Cadence: every 6 hours via cron. Also dispatchable manually.
#
# When all conditions hold, this workflow:
#   1. Computes the next alpha version (bumps the prerelease counter).
#   2. Generates a new history file at `docs/history/NNN-release-vX.Y.Z-alpha.M.md`
#      from the PRs merged since the previous alpha tag.
#   3. Bumps `package.json` and regenerates `public/changelog-alpha.json`.
#   4. Commits + tags + pushes. The existing `release.yml` workflow picks
#      up the new tag and builds/publishes the alpha.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (compute next version + history file, do not commit/tag)"
        required: false
        default: "false"
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write          # commit + tag + push
  pull-requests: write     # open auto-merge PR for the release commit

concurrency:
  group: aw-alpha-cut-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'cut' }}
  cancel-in-progress: false

jobs:
  preflight:
    # Cron + manual dispatch only. The pull_request:closed event triggers tag-after-merge below.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      should_cut: ${{ steps.check.outputs.should_cut }}
      next_version: ${{ steps.check.outputs.next_version }}
      next_history_number: ${{ steps.check.outputs.next_history_number }}
      pr_numbers: ${{ steps.check.outputs.pr_numbers }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # need full history for `git describe` and PR enumeration

      - name: Determine whether to cut a new alpha
        id: check
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail

          # 1. Last alpha tag.
          previous_tag=$(git tag --list 'v*-alpha.*' --sort=-v:refname | head -1 || echo "")
          if [[ -z "$previous_tag" ]]; then
            echo "No previous alpha tag found — would need to bootstrap. Skipping."
            echo "should_cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Previous alpha: $previous_tag"

          # 2. Check for merged PRs since previous_tag.
          since_iso=$(git log -1 --format=%cI "$previous_tag")

          # 2a. Detect merged PRs with no tier label — refuse to cut until
          # they are tiered. Human-merged PRs often land without tier labels
          # (the classifier only fires on bot-authored PRs), which caused the
          # preflight to evaluate zero qualifying PRs even when real work had
          # landed. Checking first blocks the cut and surfaces the listing so
          # the release manager can tier each PR before re-dispatching.
          echo "Checking for merged PRs without tier labels since $since_iso"
          unclassified_prs=$(gh pr list \
            --state merged --base main \
            --search "merged:>$since_iso -label:tier:A -label:tier:B -label:tier:C" \
            --json number --jq '.[].number')

          if [[ -n "$unclassified_prs" ]]; then
            echo "Unclassified merged PRs found — auto-labelling as tier:B."
            for pr in $unclassified_prs; do
              echo "  Labelling PR #$pr as tier:B"
              gh pr edit "$pr" --add-label "tier:B"
            done
            {
              echo "## ℹ️ Auto-classified untiered merged PRs as tier:B"
              echo ""
              echo "The following PRs were merged to \`main\` since \`$previous_tag\` without a tier label."
              echo "They have been auto-classified as \`tier:B\` (included in this alpha cut)."
              echo ""
              echo "| PR | Title |"
              echo "|---|---|"
              for pr in $unclassified_prs; do
                gh pr view "$pr" --json number,title --jq '"| #\(.number) | \(.title) |"'
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # 2b. Tier-A or Tier-B PRs merged since previous_tag?
          echo "Looking for tier:A/B PRs merged since $since_iso"
          pr_numbers=$(gh pr list \
            --state merged --base main \
            --search "merged:>$since_iso label:tier:A,tier:B" \
            --json number --jq '.[].number' | tr '\n' ',' | sed 's/,$//')

          if [[ -z "$pr_numbers" ]]; then
            echo "No Tier-A/B PRs merged since $previous_tag — nothing to ship."
            echo "should_cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "PRs to ship: $pr_numbers"
          echo "pr_numbers=$pr_numbers" >> "$GITHUB_OUTPUT"

          # 3. Real-E2E green on main within 24h?
          one_day_ago=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-1d +%Y-%m-%dT%H:%M:%SZ)
          last_e2e=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?branch=main&status=completed&per_page=10" \
            --jq '.workflow_runs[] | select(.updated_at > "'$one_day_ago'") | .id' \
            | head -10)
          e2e_green="false"
          for run_id in $last_e2e; do
            real_conclusion=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs" \
              --jq '.jobs[] | select(.name == "Real Tauri E2E Tests") | .conclusion' || echo "")
            if [[ "$real_conclusion" == "success" ]]; then
              e2e_green="true"
              echo "Real-E2E green on main: run $run_id"
              break
            fi
          done
          if [[ "$e2e_green" != "true" ]]; then
            echo "No green Real-E2E run on main within 24h — refusing to cut."
            echo "should_cut=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4. No open tier:C PRs waiting?
          tier_c_open=$(gh pr list --state open --label tier:C --json number --jq '.[].number' | wc -l)
          if (( tier_c_open > 0 )); then
            echo "$tier_c_open open Tier-C PR(s) waiting on human review — cutting alpha anyway (Tier-C is for stable promotion gate, not alpha gate)."
          fi

          # 5. Compute next alpha version.
          # previous_tag format: vX.Y.Z-alpha.M
          version=${previous_tag#v}
          base=${version%-alpha.*}
          counter=${version#*-alpha.}
          next_counter=$(( counter + 1 ))
          next_version="${base}-alpha.${next_counter}"
          echo "Next alpha: v$next_version"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

          # 6. Next history file number.
          last_num=$(ls docs/history/ | grep -oE '^[0-9]+' | sort -n | tail -1)
          next_num=$(printf "%03d" $((10#$last_num + 1)))
          echo "Next history file: $next_num-release-v$next_version.md"
          echo "next_history_number=$next_num" >> "$GITHUB_OUTPUT"

          echo "should_cut=true" >> "$GITHUB_OUTPUT"

  cut:
    needs: preflight
    if: needs.preflight.outputs.should_cut == 'true' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump package.json
        env:
          NEXT_VERSION: ${{ needs.preflight.outputs.next_version }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.NEXT_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          grep '"version"' package.json | head -1

      - name: Generate history file from merged PRs
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          PR_NUMBERS: ${{ needs.preflight.outputs.pr_numbers }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          NEXT_VERSION: ${{ needs.preflight.outputs.next_version }}
          NEXT_NUMBER: ${{ needs.preflight.outputs.next_history_number }}
        run: |
          set -euo pipefail

          DATE=$(date -u +%Y-%m-%d)
          FILE="docs/history/${NEXT_NUMBER}-release-v${NEXT_VERSION}.md"

          {
            echo "# Release v${NEXT_VERSION}"
            echo ""
            echo "**Date:** ${DATE}"
            echo "**Previous version:** ${PREVIOUS_TAG#v}"
            echo "**Channel:** Alpha"
            echo ""
            echo "Auto-cut by \`aw-alpha-cut\` after Tier-A/B PRs landed. The auto-dump under \"Under the hood\" lists the merged PRs verbatim."
            echo ""
            echo "Before promoting this alpha to stable, edit this file:"
            echo "  - Move anything user-visible from \"Under the hood\" into \"## Changes\" under \`### Features\`, \`### Improvements\`, or \`### Fixes\` — and rewrite each bullet in user-facing prose (drop PR titles, version triples, internal jargon)."
            echo "  - Leave \"## Changes\" as \`_No user-visible changes._\` for infra-only releases."
            echo "  - See \`feedback_user_facing_release_notes.md\` and \`scripts/generate-changelog.ts\` linter rules."
            echo ""
            echo "## Changes"
            echo ""
            echo "_No user-visible changes._"
            echo ""
            echo "## Under the hood"
            echo ""
            echo "Auto-generated dump of merged Tier-A/B PRs. Rewrite as prose grouped by area before stable promotion."
            echo ""
            IFS=',' read -ra PRS <<< "$PR_NUMBERS"
            for pr in "${PRS[@]}"; do
              title=$(gh pr view "$pr" --json title --jq .title)
              echo "- ${title} (#${pr})"
            done
          } > "$FILE"

          cat "$FILE"

      - name: Update history README
        env:
          NEXT_VERSION: ${{ needs.preflight.outputs.next_version }}
          NEXT_NUMBER: ${{ needs.preflight.outputs.next_history_number }}
        run: |
          set -euo pipefail
          line="| ${NEXT_NUMBER} | [Release v${NEXT_VERSION}](${NEXT_NUMBER}-release-v${NEXT_VERSION}.md) | Auto-cut alpha by \`aw-alpha-cut\`. See merged PRs for details. |"
          echo "$line" >> docs/history/README.md

      - name: Regenerate changelog
        run: pnpm install --frozen-lockfile && pnpm generate-changelog
        env:
          # pnpm may try to read tarballs; ensure we have access
          NPM_CONFIG_USERCONFIG: /dev/null

      - name: Commit on release branch and open auto-merge PR
        env:
          NEXT_VERSION: ${{ needs.preflight.outputs.next_version }}
          PR_NUMBERS: ${{ needs.preflight.outputs.pr_numbers }}
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail

          # Branch protection on main requires 4 status checks to have passed
          # on the commit being pushed, so we can't push directly. Open an
          # auto-merge PR instead — the PR runs the same Tests workflow, and
          # auto-merge fires once the 4 checks are green. The tag-after-merge
          # job (in this same workflow file) tags + pushes the tag once the
          # PR's merge commit lands on main.
          BRANCH="release/v${NEXT_VERSION}"
          git checkout -b "$BRANCH"
          git add package.json docs/history/ public/
          git commit -m "chore: release v${NEXT_VERSION} (auto-cut by aw-alpha-cut)"
          git push -u origin "$BRANCH"

          # PR body: one bullet per Tier-A/B PR that earned this alpha cut.
          {
            echo "Auto-cut by \`aw-alpha-cut\`. The history file at \`docs/history/${{ needs.preflight.outputs.next_history_number }}-release-v${NEXT_VERSION}.md\` lists the merged PRs."
            echo ""
            echo "## PRs included"
            echo ""
            IFS=',' read -ra PRS <<< "$PR_NUMBERS"
            for pr in "${PRS[@]}"; do
              echo "- #${pr}"
            done
            echo ""
            echo "Auto-merge enabled. Once the 4 required status checks pass, this merges to main, and the \`tag-after-merge\` job in \`aw-alpha-cut.yml\` tags + pushes \`v${NEXT_VERSION}\`. \`release.yml\` then builds and publishes."
          } > /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: release v${NEXT_VERSION}" \
            --body-file /tmp/pr-body.md \
            --label "tier:A"

          gh pr merge "$BRANCH" --auto --merge

          echo "Opened auto-merge PR for v${NEXT_VERSION} on branch $BRANCH."

  tag-after-merge:
    # Fires when a release/v* PR opened by the cut job merges to main.
    # Tags the merge commit and pushes the tag, which triggers release.yml.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.WORKFLOW_PAT }}
          ref: main
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag merge commit and push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Branch was `release/v${NEXT_VERSION}` — strip the prefix to get the tag.
          TAG="${BRANCH#release/}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged and pushed $TAG. release.yml will pick it up and publish."
