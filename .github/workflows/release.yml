name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.1.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  create-release:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_notes: ${{ steps.release_notes.outputs.notes }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changelog.json
        run: pnpm run generate-changelog

      - name: Generate release notes
        id: release_notes
        run: |
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --pretty="format:- %s" HEAD)
          else
            COMMITS=$(git log --oneline --pretty="format:- %s" "${PREV_TAG}..HEAD")
          fi

          # Write to file for multi-line output
          echo "## Changes" > /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          echo "$COMMITS" >> /tmp/release_notes.md

          # Set as output using delimiter
          echo "notes<<NOTES_EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_notes.md >> $GITHUB_OUTPUT
          echo "NOTES_EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');

            // HARD GUARANTEE: stable users must never be auto-pushed to a
            // prerelease. The prerelease flag is the load-bearing signal —
            // GitHub's `releases/latest` resolver skips prereleases, so an
            // alpha/beta/rc tag MUST be flagged `prerelease: true` here.
            //
            // Before this auto-detection, the hardcoded `prerelease: false`
            // shipped alpha.0 + alpha.1 as non-prerelease releases and stable
            // users got auto-upgraded to alpha. See feedback_channel_isolation_hard_guarantee.md.
            //
            // Auto-detect from the tag suffix. Matches the semver prerelease
            // grammar: any `-` segment after the version triple.
            const isPrerelease = /-(alpha|beta|rc)(\.|$)/.test(tag);

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Notesage ${tag}`,
              body: process.env.RELEASE_NOTES,
              draft: true,
              prerelease: isPrerelease
            })
            return data.id

      - name: Upload changelog.json to release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releaseId = ${{ steps.create-release.outputs.result }};
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'changelog.json',
              data: fs.readFileSync('public/changelog.json'),
              headers: { 'content-type': 'application/json' }
            });

  build-tauri:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build llama-server from source (static)
        run: |
          LLAMA_VERSION=$(cat src-tauri/binaries/LLAMA_CPP_VERSION | tr -d '[:space:]')
          echo "Building llama.cpp $LLAMA_VERSION"

          git clone --depth 1 --branch "$LLAMA_VERSION" https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          cmake -B /tmp/llama.cpp/build -S /tmp/llama.cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

          cmake --build /tmp/llama.cpp/build --config Release --target llama-server -j $(sysctl -n hw.logicalcpu)

          # Copy the static binary to the sidecar location
          cp /tmp/llama.cpp/build/bin/llama-server src-tauri/binaries/llama-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/llama-server-aarch64-apple-darwin

          # Verify no non-system dynamic dependencies (homebrew, @rpath, etc.)
          echo "Dependencies:"
          otool -L src-tauri/binaries/llama-server-aarch64-apple-darwin
          echo "Binary size: $(du -h src-tauri/binaries/llama-server-aarch64-apple-darwin | cut -f1)"

          # Fail build if any homebrew or @rpath dependencies are found
          if otool -L src-tauri/binaries/llama-server-aarch64-apple-darwin | grep -q -E "homebrew|@rpath"; then
            echo "::error::llama-server has non-system dynamic dependencies that will break code signing"
            otool -L src-tauri/binaries/llama-server-aarch64-apple-darwin | grep -E "homebrew|@rpath"
            exit 1
          fi
          echo "✓ No problematic dependencies found"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version from tag
        shell: bash
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Building version $VERSION from tag $GITHUB_REF"

          # Update package.json using node (sed can corrupt JSON with special chars like ~)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update Cargo.toml (^version anchored to line start is safe for TOML)
          sed "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp && mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

          echo "Updated config files to version $VERSION"
          cat package.json | grep version
          cat src-tauri/Cargo.toml | grep version

      - name: Set whisper.cpp build flags
        run: |
          # Disable -mcpu=native to avoid i8mm intrinsic errors on CI clang.
          # Set explicit ARM arch with dotprod+fp16 (supported by all Apple Silicon M1+)
          # but without i8mm (which causes compilation errors in ggml-cpu).
          # Metal GPU acceleration handles the heavy lifting for Whisper inference.
          echo "WHISPER_NATIVE=OFF" >> $GITHUB_ENV
          echo "CMAKE_C_FLAGS=-march=armv8.2-a+dotprod+fp16 -mmacosx-version-min=14.0" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod+fp16 -mmacosx-version-min=14.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing & notarization
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Tauri update signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # tagName and releaseName intentionally omitted: passing them alongside
          # releaseId causes tauri-action@v0 to attempt a second createRelease call
          # for the same tag, producing an already_exists error or an orphan draft
          # release (issue #203). releaseId alone is sufficient to upload assets.
          releaseBody: ${{ needs.create-release.outputs.release_notes }}
          args: --target aarch64-apple-darwin

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest

    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            })

  # Rolling pointer for the in-app alpha-channel auto-updater. The app
  # (`src/hooks/useAutoUpdate.ts`) hits a static URL for the alpha channel:
  # https://github.com/PeterBlenessy/notesage/releases/download/latest-alpha/latest.json
  # — that resolves only if a release with tag `latest-alpha` exists and
  # carries the freshest alpha's assets. This job re-creates that release
  # on every alpha tag so the URL keeps resolving to the latest manifest.
  #
  # Stable releases skip this — the stable channel uses
  # `releases/latest/download/latest.json` which GitHub resolves
  # automatically (latest non-prerelease release).
  update-latest-alpha:
    needs: [create-release, build-tauri, publish-release]
    if: contains(github.ref_name, '-alpha')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download alpha release assets
        run: |
          mkdir -p /tmp/alpha-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir /tmp/alpha-assets
          ls -la /tmp/alpha-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace latest-alpha rolling release
        run: |
          # Delete the previous rolling release if it exists (best-effort —
          # first alpha after this workflow lands will skip the delete cleanly).
          gh release delete latest-alpha \
            --repo "${GITHUB_REPOSITORY}" \
            --yes \
            --cleanup-tag || true

          # Re-create pointing at this alpha tag's commit. MUST be flagged
          # as prerelease — otherwise GitHub's `releases/latest` resolver
          # would pick this up as "latest stable" (it sorts by published_at
          # date, ignoring tag-name conventions) and stable-channel users
          # would silently receive alpha builds. The alpha-channel URL is
          # a direct asset path (`releases/download/latest-alpha/latest.json`)
          # which works regardless of the prerelease flag.
          gh release create latest-alpha \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Latest Alpha (rolling pointer)" \
            --prerelease \
            --notes "Rolling release used by the Notesage alpha-channel auto-updater. Always points at the most recent alpha build.

          **Currently points at:** [${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME})

          Do not delete. This release's assets are overwritten by the release workflow on every alpha tag." \
            /tmp/alpha-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
