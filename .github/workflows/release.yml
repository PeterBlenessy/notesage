name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.1.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  create-release:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_notes: ${{ steps.release_notes.outputs.notes }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changelog.json
        run: pnpm run generate-changelog

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          HISTORY_FILE=$(ls docs/history/*-release-v${VERSION}.md 2>/dev/null | head -1)

          if [ -z "$HISTORY_FILE" ]; then
            echo "::error::No history file found at docs/history/*-release-v${VERSION}.md — release notes required before tag."
            exit 1
          fi

          # Release-note body depends on the channel:
          #
          #   Stable (no `-` in the version): user-facing content only —
          #   everything between "## Changes" and "## Under the hood". The stop
          #   fires ONLY on "## Under the hood"; sections like "## Known issues"
          #   and "## Known limitations" are user-facing and must be included.
          #
          #   Alpha (prerelease, e.g. `0.46.0-alpha.5`): include "## Under the
          #   hood" too, so the merged-PR dump is visible on the GitHub Release
          #   page — that's what made the cut. Auto-cut alphas have no curated
          #   "## Changes" yet, so without this the body reads only
          #   "_No user-visible changes._".
          if [[ "$VERSION" == *-* ]]; then
            awk '
              /^## Changes/{found=1; next}
              found{print}
            ' "$HISTORY_FILE" > /tmp/release_notes.md
          else
            awk '
              /^## Changes/{found=1; next}
              found && /^## Under the hood/{exit}
              found{print}
            ' "$HISTORY_FILE" > /tmp/release_notes.md
          fi

          # Set as output using delimiter
          echo "notes<<NOTES_EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_notes.md >> $GITHUB_OUTPUT
          echo "NOTES_EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        # TODO: bump to actions/github-script@v8 when available on Node 24 — https://github.com/actions/github-script/releases
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');

            // HARD GUARANTEE: stable users must never be auto-pushed to a
            // prerelease. The prerelease flag is the load-bearing signal —
            // GitHub's `releases/latest` resolver skips prereleases, so an
            // alpha/beta/rc tag MUST be flagged `prerelease: true` here.
            //
            // Before this auto-detection, the hardcoded `prerelease: false`
            // shipped alpha.0 + alpha.1 as non-prerelease releases and stable
            // users got auto-upgraded to alpha. See feedback_channel_isolation_hard_guarantee.md.
            //
            // Auto-detect from the tag suffix. Matches the semver prerelease
            // grammar: any `-` segment after the version triple.
            const isPrerelease = /-(alpha|beta|rc)(\.|$)/.test(tag);

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Notesage ${tag}`,
              body: process.env.RELEASE_NOTES,
              draft: true,
              prerelease: isPrerelease
            })
            return data.id

      - name: Upload changelog feed to release
        # TODO: bump to actions/github-script@v8 when available on Node 24 — https://github.com/actions/github-script/releases
        uses: actions/github-script@v7
        with:
          script: |
            // ONE feed. Every release uploads `public/changelog.json` as the
            // asset `changelog.json`, and the app fetches it from
            // `releases/latest/download/changelog.json`. The stable/alpha
            // split was removed with the release channel itself — PRD
            // `docs/prds/2026-08-15-single-binary-feature-flags.md`.
            const fs = require('fs');
            const releaseId = ${{ steps.create-release.outputs.result }};
            const assetName = 'changelog.json';
            const sourceFile = 'public/changelog.json';
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: assetName,
              data: fs.readFileSync(sourceFile),
              headers: { 'content-type': 'application/json' }
            });

  build-tauri:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build llama-server from source (static)
        run: |
          LLAMA_VERSION=$(cat src-tauri/binaries/LLAMA_CPP_VERSION | tr -d '[:space:]')
          echo "Building llama.cpp $LLAMA_VERSION"

          git clone --depth 1 --branch "$LLAMA_VERSION" https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          cmake -B /tmp/llama.cpp/build -S /tmp/llama.cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_STATIC=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

          cmake --build /tmp/llama.cpp/build --config Release --target llama-server -j $(sysctl -n hw.logicalcpu)

          # Copy the static binary to the sidecar location
          cp /tmp/llama.cpp/build/bin/llama-server src-tauri/binaries/llama-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/llama-server-aarch64-apple-darwin

          # Verify no non-system dynamic dependencies (homebrew, @rpath, etc.)
          echo "Dependencies:"
          otool -L src-tauri/binaries/llama-server-aarch64-apple-darwin
          echo "Binary size: $(du -h src-tauri/binaries/llama-server-aarch64-apple-darwin | cut -f1)"

          # Fail build if any homebrew or @rpath dependencies are found
          if otool -L src-tauri/binaries/llama-server-aarch64-apple-darwin | grep -q -E "homebrew|@rpath"; then
            echo "::error::llama-server has non-system dynamic dependencies that will break code signing"
            otool -L src-tauri/binaries/llama-server-aarch64-apple-darwin | grep -E "homebrew|@rpath"
            exit 1
          fi
          echo "✓ No problematic dependencies found"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version from tag
        shell: bash
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Building version $VERSION from tag $GITHUB_REF"

          # Update package.json using node (sed can corrupt JSON with special chars like ~)
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update Cargo.toml (^version anchored to line start is safe for TOML)
          sed "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml > src-tauri/Cargo.toml.tmp && mv src-tauri/Cargo.toml.tmp src-tauri/Cargo.toml

          echo "Updated config files to version $VERSION"
          cat package.json | grep version
          cat src-tauri/Cargo.toml | grep version

      - name: Set whisper.cpp build flags
        run: |
          # Disable -mcpu=native to avoid i8mm intrinsic errors on CI clang.
          # Set explicit ARM arch with dotprod+fp16 (supported by all Apple Silicon M1+)
          # but without i8mm (which causes compilation errors in ggml-cpu).
          # Metal GPU acceleration handles the heavy lifting for Whisper inference.
          echo "WHISPER_NATIVE=OFF" >> $GITHUB_ENV
          echo "CMAKE_C_FLAGS=-march=armv8.2-a+dotprod+fp16 -mmacosx-version-min=14.0" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod+fp16 -mmacosx-version-min=14.0" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing & notarization
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # Tauri update signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Telemetry keys — RELEASE builds only (this workflow runs on v* tags).
          # Read at compile time via `option_env!` in src-tauri/src/lib.rs; unset
          # → telemetry compiles out to a clean no-op. Add these as repository
          # secrets: NOTESAGE_SENTRY_DSN, NOTESAGE_APTABASE_KEY.
          NOTESAGE_SENTRY_DSN: ${{ secrets.NOTESAGE_SENTRY_DSN }}
          NOTESAGE_APTABASE_KEY: ${{ secrets.NOTESAGE_APTABASE_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # tagName and releaseName intentionally omitted: passing them alongside
          # releaseId causes tauri-action@v0 to attempt a second createRelease call
          # for the same tag, producing an already_exists error or an orphan draft
          # release (issue #203). releaseId alone is sufficient to upload assets.
          releaseBody: ${{ needs.create-release.outputs.release_notes }}
          args: --target aarch64-apple-darwin

      # ---------------------------------------------------------------------
      # macOS Share Extension — embedded AFTER the bundle exists.
      #
      # `tauri-bundler` assembles and signs the .app in one pass, then derives
      # the .dmg and updater tarball from it. `beforeBundleCommand` runs before
      # the bundling phase, when no .app exists (checked against the Tauri 2.11
      # config schema), so there is no seam to embed into. We therefore embed
      # into the finished bundle and regenerate everything downstream.
      #
      # Deliberately ordered AFTER tauri-action's upload: if the embed or
      # notarisation fails, the release keeps the artifacts tauri-action already
      # published — properly signed and notarised, just without the extension,
      # i.e. exactly how every release before this one behaved.
      #
      # The one state to fear is a release whose updater signature disagrees
      # with its tarball. That is MITIGATED, not impossible — see the
      # `Replace release assets` step, which cannot be atomic because GitHub
      # has no atomic asset swap. Two things keep it off users: the job fails,
      # which skips `publish-release` and leaves the release a draft; and the
      # step logs an explicit DO-NOT-PUBLISH warning naming the inconsistency,
      # because the realistic way this bites is a human publishing the draft by
      # hand while debugging.
      # ---------------------------------------------------------------------
      - name: Import Developer ID certificate
        # Own keychain rather than reusing whatever tauri-action left behind —
        # codesign needs an unlocked keychain with the partition list set, and
        # depending on another action's internal state for that is how signing
        # breaks silently on an upgrade.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/notesage-signing.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Embed Share Extension and rebuild derived artifacts
        id: embed
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: aarch64-apple-darwin
        run: scripts/macos-release-embed.sh

      - name: Replace release assets with the embedded build
        # Swaps the three derived artifacts and patches latest.json's signature
        # to match the NEW tarball. The signature and the tarball must move
        # together: a `latest.json` whose signature does not match the tarball
        # beside it breaks auto-update for every desktop user.
        #
        # GitHub has no atomic asset replace — no rename, and names must be
        # unique, so a swap is necessarily delete-then-upload. This step
        # therefore does NOT claim to be atomic (an earlier version of this
        # comment did, wrongly). What it does instead:
        #
        #   1. PREPARE everything first — read all three files, fetch and patch
        #      the manifest in memory — before touching the release. Every
        #      "missing file", "no signature", "no darwin entry" failure now
        #      happens while the release is still untouched, which is where the
        #      earlier version got it wrong: it validated the manifest AFTER
        #      already replacing the tarball.
        #   2. Retry uploads, since a transient API error is the realistic
        #      failure and re-trying costs nothing.
        #   3. VERIFY by re-listing afterwards, so a half-applied swap is
        #      detected rather than assumed away.
        #   4. If it still ends up half-applied, say so unmistakably. The
        #      release is a draft and `publish-release` is skipped when this
        #      job fails, so nothing reaches users automatically — but a human
        #      debugging a red release job could reasonably flip the draft by
        #      hand, and the log has to stop them.
        # TODO: bump to actions/github-script@v8 when available on Node 24 — https://github.com/actions/github-script/releases
        uses: actions/github-script@v7
        env:
          DMG_PATH: ${{ steps.embed.outputs.dmg }}
          TARBALL_PATH: ${{ steps.embed.outputs.tarball }}
          SIG_PATH: ${{ steps.embed.outputs.sig }}
          NEW_SIGNATURE: ${{ steps.embed.outputs.signature }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            const { owner, repo } = context.repo;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: releaseId, per_page: 100,
            });

            // ---- 1. PREPARE ---------------------------------------------------
            // Nothing below this section mutates the release. Every way this
            // step can legitimately give up belongs here, while giving up is
            // free.
            // Match by SUFFIX, and upload under the EXISTING asset's name.
            //
            // v0.52.0 shipped broken because this used `path.basename()`. The
            // local tarball is `Notesage.app.tar.gz`; tauri-action publishes it
            // as `Notesage_aarch64.app.tar.gz`. No existing asset matched, so
            // nothing was deleted and a SECOND tarball was added alongside the
            // original — while latest.json kept pointing at the original and
            // carried the new one's signature. Every updater then downloaded
            // one file and verified it against another's signature.
            //
            // Reusing the published name keeps latest.json's URL valid, so only
            // the signature needs patching. Renaming the asset would silently
            // invalidate every URL in a manifest we do not fully control.
            const suffixes = [
              { env: 'DMG_PATH', suffix: '.dmg' },
              { env: 'TARBALL_PATH', suffix: '.app.tar.gz' },
              { env: 'SIG_PATH', suffix: '.app.tar.gz.sig' },
            ];
            const pending = [];
            for (const { env, suffix } of suffixes) {
              const filePath = process.env[env];
              if (!filePath) {
                core.setFailed(`embed step did not report ${env}`);
                return;
              }
              if (!fs.existsSync(filePath) || fs.statSync(filePath).size === 0) {
                core.setFailed(`Artifact missing or empty: ${filePath}`);
                return;
              }
              // `.app.tar.gz` would also match `.app.tar.gz.sig`, so exclude it.
              const existing = assets.filter(a =>
                a.name.endsWith(suffix) &&
                (suffix !== '.app.tar.gz' || !a.name.endsWith('.sig')));
              if (existing.length !== 1) {
                core.setFailed(
                  `Expected exactly one published asset ending "${suffix}", found ${existing.length}` +
                  ` (${existing.map(a => a.name).join(', ') || 'none'}). Refusing to guess which to replace.`);
                return;
              }
              pending.push({
                name: existing[0].name,
                assetId: existing[0].id,
                data: fs.readFileSync(filePath),
                contentType: 'application/octet-stream',
              });
            }

            // latest.json embeds the signature inline; a stale one points the
            // updater at a tarball it will then refuse to install.
            const manifestAsset = assets.find(a => a.name === 'latest.json');
            if (!manifestAsset) {
              core.setFailed('latest.json not found — cannot reconcile updater signature');
              return;
            }
            const newSig = process.env.NEW_SIGNATURE;
            if (!newSig) {
              core.setFailed('embed step produced no signature');
              return;
            }
            const { data: raw } = await github.rest.repos.getReleaseAsset({
              owner, repo, asset_id: manifestAsset.id,
              headers: { accept: 'application/octet-stream' },
            });
            const manifest = JSON.parse(
              Buffer.isBuffer(raw) ? raw.toString('utf8') : new TextDecoder().decode(raw),
            );
            let patched = 0;
            for (const key of Object.keys(manifest.platforms || {})) {
              if (key.startsWith('darwin')) {
                manifest.platforms[key].signature = newSig;
                patched++;
              }
            }
            if (patched === 0) {
              core.setFailed('no darwin platform entry in latest.json to patch');
              return;
            }
            pending.push({
              name: 'latest.json',
              // Carrying the id matters: the commit loop deletes by `assetId`,
              // and an entry without one is uploaded over a name that still
              // exists — which GitHub rejects with `already_exists`. That is
              // exactly how v0.52.1's first attempt half-applied: the three
              // artifacts swapped, then the manifest could not, leaving a new
              // tarball beside a signature for the old one.
              assetId: manifestAsset.id,
              data: JSON.stringify(manifest, null, 2),
              contentType: 'application/json',
            });

            // ---- 2. COMMIT ----------------------------------------------------
            // From the first delete onward the release is inconsistent until
            // the last upload lands.
            const withRetry = async (label, fn) => {
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  return await fn();
                } catch (err) {
                  if (attempt === 3) throw err;
                  core.warning(`${label} failed (attempt ${attempt}/3): ${err.message} — retrying`);
                  await new Promise(r => setTimeout(r, 2000 * attempt));
                }
              }
            };

            let mutated = false;
            try {
              for (const item of pending) {
                // Fall back to a name lookup rather than trusting `assetId` to
                // have been set. Uploading over a name that still exists fails
                // with `already_exists`, and by then earlier artifacts have
                // already been swapped — a missing id turns into a half-applied
                // release rather than a clean failure.
                const assetId = item.assetId ?? assets.find(a => a.name === item.name)?.id;
                if (assetId) {
                  await withRetry(`delete ${item.name}`, () =>
                    github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: assetId }));
                  mutated = true;
                }
                await withRetry(`upload ${item.name}`, () =>
                  github.rest.repos.uploadReleaseAsset({
                    owner, repo, release_id: releaseId, name: item.name,
                    data: item.data,
                    headers: {
                      'content-type': item.contentType,
                      'content-length': Buffer.byteLength(item.data),
                    },
                  }));
                mutated = true;
                core.info(`Replaced ${item.name}`);
              }
            } catch (err) {
              if (mutated) {
                core.error(
                  'DO NOT PUBLISH THIS DRAFT. Asset replacement failed part-way, so the ' +
                  'release may now carry an updater signature that does not match its ' +
                  'tarball — installing it would break auto-update. Delete the draft ' +
                  'release and re-run the tag.',
                );
              }
              core.setFailed(`Asset replacement failed: ${err.message}`);
              return;
            }

            // ---- 3. VERIFY ----------------------------------------------------
            // Re-list rather than trust the writes: the whole point of this step
            // is that a half-applied swap must not pass silently.
            const { data: after } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: releaseId, per_page: 100,
            });
            const missing = pending
              .filter(item => !after.some(a => a.name === item.name && a.size > 0))
              .map(item => item.name);
            if (missing.length > 0) {
              core.error(
                `DO NOT PUBLISH THIS DRAFT. Missing or empty after replacement: ${missing.join(', ')}.`,
              );
              core.setFailed('Release assets are inconsistent after replacement');
              return;
            }

            // The property that actually governs auto-update: the file
            // latest.json POINTS AT must be the file whose signature it
            // CARRIES. v0.52.0 satisfied every check above and still shipped
            // broken, because "the assets I uploaded are present" is
            // bookkeeping, not correctness — the manifest pointed at a
            // different tarball than the one it was signing for.
            const tarballAsset = pending.find(p => p.name.endsWith('.app.tar.gz'));
            const problems = [];
            for (const [key, platform] of Object.entries(manifest.platforms || {})) {
              if (!key.startsWith('darwin')) continue;
              const referenced = (platform.url || '').split('/').pop();
              if (!after.some(a => a.name === referenced)) {
                problems.push(`${key}: url points at "${referenced}", which is not a published asset`);
              } else if (referenced !== tarballAsset.name) {
                problems.push(
                  `${key}: url points at "${referenced}" but the signature signs "${tarballAsset.name}"`);
              }
              if ((platform.signature || '').trim() !== newSig.trim()) {
                problems.push(`${key}: signature is not the one produced for the rebuilt tarball`);
              }
            }
            if (problems.length > 0) {
              core.error(
                'DO NOT PUBLISH THIS DRAFT. The updater manifest does not agree with the ' +
                'published assets, which breaks auto-update for every desktop user:\n  ' +
                problems.join('\n  '));
              core.setFailed('latest.json disagrees with the published assets');
              return;
            }

            core.info(
              `Patched updater signature on ${patched} darwin entry/entries; ` +
              `manifest points at ${tarballAsset.name} and its signature matches.`);

      # tauri-action@v0, when invoked with releaseId (and thus without tagName),
      # generates `latest.json` URLs of the form
      #   https://github.com/<repo>/releases/latest/download/<file>
      # That URL resolves to whatever GitHub considers the "Latest" release
      # (skips prereleases). For a stable tag this is harmless; for an alpha tag
      # it resolves to the latest STABLE release's binary, and the in-app updater
      # enters an infinite "install latest" loop because every fetched bundle is
      # the same as the running build. See issue #271.
      #
      # Patch the URLs to the tag-explicit form
      #   https://github.com/<repo>/releases/download/<TAG>/<file>
      # before the release flips to public.
      - name: Patch latest.json URLs to tag-explicit form
        # TODO: bump to actions/github-script@v8 when available on Node 24 — https://github.com/actions/github-script/releases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releaseId = ${{ needs.create-release.outputs.release_id }};
            const tag = context.ref.replace('refs/tags/', '');

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            const manifestAsset = assets.find(a => a.name === 'latest.json');
            if (!manifestAsset) {
              core.setFailed('latest.json not found among release assets');
              return;
            }

            // Download via the assets API. We need a Bearer token to fetch the
            // raw asset bytes (rather than the GitHub redirect to a SAS URL).
            const { data: rawManifest } = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: manifestAsset.id,
              headers: { accept: 'application/octet-stream' },
            });

            // octokit returns the body as an ArrayBuffer here; coerce to string.
            const manifestText = Buffer.isBuffer(rawManifest)
              ? rawManifest.toString('utf8')
              : new TextDecoder().decode(rawManifest);
            const manifest = JSON.parse(manifestText);

            const wrongPrefix = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/latest/download/`;
            const rightPrefix = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/`;

            let changed = 0;
            for (const platformKey of Object.keys(manifest.platforms || {})) {
              const url = manifest.platforms[platformKey].url;
              if (url && url.startsWith(wrongPrefix)) {
                manifest.platforms[platformKey].url = url.replace(wrongPrefix, rightPrefix);
                changed++;
              }
            }

            if (changed === 0) {
              core.info(`No URL rewrite needed (manifest already tag-explicit).`);
              return;
            }

            core.info(`Rewrote ${changed} URL(s) in latest.json from /releases/latest/ to /releases/download/${tag}/`);

            // Delete the old asset and re-upload the patched one.
            await github.rest.repos.deleteReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: manifestAsset.id,
            });

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: JSON.stringify(manifest, null, 2),
              headers: { 'content-type': 'application/json' },
            });

            core.info('latest.json re-uploaded with tag-explicit URLs.');

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest

    steps:
      - name: Publish Release
        # TODO: bump to actions/github-script@v8 when available on Node 24 — https://github.com/actions/github-script/releases
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            })

  # Rolling pointer for the in-app alpha-channel auto-updater. The app
  # (`src/hooks/useAutoUpdate.ts`) hits a static URL for the alpha channel:
  # https://github.com/PeterBlenessy/notesage/releases/download/latest-alpha/latest.json
  # — that resolves only if a release with tag `latest-alpha` exists and
  # carries the freshest alpha's assets. This job re-creates that release
  # on every alpha tag so the URL keeps resolving to the latest manifest.
  #
  # Stable releases skip this — the stable channel uses
  # `releases/latest/download/latest.json` which GitHub resolves
  # automatically (latest non-prerelease release).
  update-latest-alpha:
    needs: [create-release, build-tauri, publish-release]
    if: contains(github.ref_name, '-alpha')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Verify real-E2E passed on main within 24h
        # TODO: bump to actions/github-script@v8 when available on Node 24 — https://github.com/actions/github-script/releases
        uses: actions/github-script@v7
        with:
          script: |
            // Gate the alpha cut on a recent green real-E2E run on main.
            // A Tauri framework bump can only ship automatically when the
            // real-app test suite confirmed the main branch is healthy.
            const oneDayAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();

            const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test.yml',
              branch: 'main',
              status: 'completed',
              per_page: 10,
            });

            for (const run of workflow_runs) {
              if (run.updated_at < oneDayAgo) break;

              const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });

              const realE2EJob = jobs.find(j => j.name === 'Real Tauri E2E Tests');
              if (realE2EJob?.conclusion === 'success') {
                core.info(`✓ Real E2E passed on main (workflow run #${run.id}, ${run.updated_at})`);
                return;
              }
            }

            core.setFailed(
              'No successful real-E2E run found on main within the last 24h. ' +
              'Ensure "Real Tauri E2E Tests" in the Tests workflow passed on main ' +
              'before cutting an alpha release. Re-run the Tests workflow on main manually if needed.'
            );

      - uses: actions/checkout@v6

      - name: Download alpha release assets
        run: |
          mkdir -p /tmp/alpha-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir /tmp/alpha-assets
          ls -la /tmp/alpha-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace latest-alpha rolling release
        run: |
          # Delete the previous rolling release if it exists (best-effort —
          # first alpha after this workflow lands will skip the delete cleanly).
          gh release delete latest-alpha \
            --repo "${GITHUB_REPOSITORY}" \
            --yes \
            --cleanup-tag || true

          # Re-create pointing at this alpha tag's commit. MUST be flagged
          # as prerelease — otherwise GitHub's `releases/latest` resolver
          # would pick this up as "latest stable" (it sorts by published_at
          # date, ignoring tag-name conventions) and stable-channel users
          # would silently receive alpha builds. The alpha-channel URL is
          # a direct asset path (`releases/download/latest-alpha/latest.json`)
          # which works regardless of the prerelease flag.
          gh release create latest-alpha \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Latest Alpha (rolling pointer)" \
            --prerelease \
            --notes "Rolling release used by the Notesage alpha-channel auto-updater. Always points at the most recent alpha build.

          **Currently points at:** [${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME})

          Do not delete. This release's assets are overwritten by the release workflow on every alpha tag." \
            /tmp/alpha-assets/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
