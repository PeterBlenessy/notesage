name: Tests

on:
  push:
    branches: [main]   # post-merge regression catch + triggers real-E2E on main
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger from GitHub Actions UI
  workflow_call: # Allow release workflow to reuse these jobs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    name: Frontend Tests & Coverage
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run contrast audit
        run: pnpm audit:contrast

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Performance benchmarks
        env:
          # Multiplier scales the per-test base budgets to absorb runner
          # variance. macos-latest under shared load consistently lands
          # 3.3-3.5x the local baseline on the markdown-parse 50KB case
          # (873-903ms observed vs 276ms local baseline = ~3.3x), so 3x
          # leaves no headroom and tests flake even without regressions.
          # 4x is the documented CI maximum and absorbs current runner
          # variance without hiding ≥25% real regressions.
          PERF_BUDGET_MULTIPLIER: "4"
        run: pnpm test:perf

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: src/perf/
          retention-days: 14

      - name: Check coverage regression
        if: github.event_name == 'pull_request'
        run: pnpm coverage:check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Post coverage summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          file-coverage-mode: none

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          # Honour the same perf-budget multiplier the Vitest perf harness uses
          # (`pnpm test:perf`). CI macOS runners pace setTimeout callbacks
          # ~1.5x slower than local AND share the runner with other jobs;
          # without the bump, `preview-fidelity.spec.ts`'s p95 timer-delay
          # assertion flakes in the 500–800 ms range against a 500 ms budget.
          PERF_BUDGET_MULTIPLIER: "3"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  rust-tests:
    name: Rust Backend Tests
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set whisper.cpp build flags
        run: |
          # Avoid i8mm intrinsic errors on CI clang (same fix as release workflow).
          # Metal GPU handles inference; CPU path needs only dotprod+fp16.
          echo "CMAKE_C_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV

      - name: Create sidecar placeholder
        run: |
          # Tauri build.rs validates externalBin paths exist.
          # The actual binary is too large to commit; create a placeholder for CI.
          mkdir -p src-tauri/binaries/lib
          touch src-tauri/binaries/llama-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/llama-server-aarch64-apple-darwin

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  real-e2e-tests:
    name: Real Tauri E2E Tests
    runs-on: macos-latest
    # Only run on push to main, workflow_dispatch, and workflow_call (e.g. release).
    # Excluded from pull_request events — the full Tauri build is too expensive
    # for every PR. Real-app regressions are caught post-merge on main and at
    # release time via workflow_call from release.yml.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set whisper.cpp build flags
        run: |
          echo "CMAKE_C_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV

      - name: Create sidecar placeholder
        run: |
          mkdir -p src-tauri/binaries/lib
          touch src-tauri/binaries/llama-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/llama-server-aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache tauri-driver binary
        id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: ${{ runner.os }}-tauri-driver-${{ hashFiles('**/Cargo.lock') }}

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver

      - name: Run real Tauri E2E tests
        run: pnpm test:e2e-real-full

      - name: Upload real-E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-logs
          path: |
            /tmp/notesage-e2e-tauri.log
            /tmp/notesage-e2e-driver.log
          retention-days: 14
