name: Tests

on:
  push:
    branches: [main]   # post-merge regression catch + triggers real-E2E on main
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger from GitHub Actions UI
  workflow_call: # Allow release workflow to reuse these jobs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'e2e/**'
              - 'e2e-real/**'
              - 'bundled-skills/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'vitest.perf.config.ts'
              - 'playwright.config.ts'
              - 'wdio.conf.ts'
              - 'index.html'

  frontend-tests:
    name: Frontend Tests & Coverage
    runs-on: macos-latest
    needs: check-changes
    # Skip for docs-only PRs. On push/workflow_dispatch/workflow_call always run.
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run contrast audit
        run: pnpm audit:contrast

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Performance benchmarks
        env:
          # Multiplier scales the per-test base budgets to absorb runner
          # variance. macos-latest under shared load consistently lands
          # 3.3-3.5x the local baseline on the markdown-parse 50KB case
          # (873-903ms observed vs 276ms local baseline = ~3.3x), so 3x
          # leaves no headroom and tests flake even without regressions.
          # 4x is the documented CI maximum and absorbs current runner
          # variance without hiding ≥25% real regressions.
          # Bumped 4 → 5 after observing repeated near-miss flakes:
          # 1KB parse at 153.27ms vs 152ms budget (off by 1.27ms) on macOS-latest.
          # The macos-latest runner pacing is more variable than the original
          # baseline assumed; 5x absorbs CI noise without masking real >25%
          # regressions.
          PERF_BUDGET_MULTIPLIER: "5"
        run: pnpm test:perf

      - name: Upload benchmark results
        if: always()
        # TODO: bump to actions/upload-artifact@v5 when available on Node 24 — https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: src/perf/
          retention-days: 14

      - name: Check coverage regression
        if: github.event_name == 'pull_request'
        run: pnpm coverage:check

      - name: Upload coverage report
        if: always()
        # TODO: bump to actions/upload-artifact@v5 when available on Node 24 — https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Post coverage summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          file-coverage-mode: none

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        env:
          # Honour the same perf-budget multiplier the Vitest perf harness uses
          # (`pnpm test:perf`). CI macOS runners pace setTimeout callbacks
          # ~1.5x slower than local AND share the runner with other jobs;
          # without the bump, `preview-fidelity.spec.ts`'s p95 timer-delay
          # assertion flakes in the 500–800 ms range against a 500 ms budget.
          PERF_BUDGET_MULTIPLIER: "3"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        # TODO: bump to actions/upload-artifact@v5 when available on Node 24 — https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  rust-tests:
    name: Rust Backend Tests
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set whisper.cpp build flags
        run: |
          # Avoid i8mm intrinsic errors on CI clang (same fix as release workflow).
          # Metal GPU handles inference; CPU path needs only dotprod+fp16.
          echo "CMAKE_C_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV

      - name: Create sidecar placeholder
        run: |
          # Tauri build.rs validates externalBin paths exist.
          # The actual binary is too large to commit; create a placeholder for CI.
          mkdir -p src-tauri/binaries/lib
          touch src-tauri/binaries/llama-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/llama-server-aarch64-apple-darwin

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # Regression guard for the v0.46.0-alpha.17/18 startup crash: with
      # NOTESAGE_APTABASE_KEY set, the Aptabase plugin registers and its setup
      # hook calls tokio::spawn — which panics ("there is no reactor running")
      # unless run() enters a Tokio runtime first. Keyless test/dev builds never
      # register the plugin, so ONLY a key'd launch reproduces it. We build with
      # a dummy key and launch briefly, asserting the app gets past plugin setup
      # (reaches the "starting up" hook) without the reactor panic.
      - name: Smoke-launch with telemetry key (aptabase startup-panic regression)
        working-directory: src-tauri
        env:
          NOTESAGE_APTABASE_KEY: "A-DEV-0000000000"
        run: |
          cargo build --bin notesage
          BIN=target/debug/notesage
          echo "Launching $BIN for 20s to verify it survives plugin setup…"
          # The webview may fail to load in headless CI (no dev server) AFTER
          # plugin setup — that's fine; we only assert plugin init succeeds.
          "$BIN" > smoke.log 2>&1 &
          PID=$!
          sleep 20
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "----- smoke.log (tail) -----"
          tail -40 smoke.log || true
          echo "----------------------------"
          if grep -qi "there is no reactor running" smoke.log; then
            echo "::error::Startup panic from the telemetry plugin reproduced — run() must enter a Tokio runtime before the Tauri builder. See src-tauri/src/lib.rs build_app_runtime()."
            exit 1
          fi
          if ! grep -q "Notesage starting up" smoke.log; then
            echo "::error::App did not reach the 'starting up' setup hook within 20s with the telemetry plugin registered — startup is broken."
            exit 1
          fi
          echo "OK: app reached startup with the telemetry plugin registered; no reactor panic."

  real-e2e-tests:
    name: Real Tauri E2E Tests
    # Pinned to `macos-26` (not `macos-latest`) to escape the Safari 26.5
    # regression that ships with `macos-15` image 20260520+ and breaks
    # the openFile → ProseMirror render path in WKWebView. macos-26 image
    # 20260520 is still on Safari 26.4 and runs the suite cleanly. See
    # issue #334. Tradeoff: macos-26 arm64 runner has 3 CPUs / 7 GB RAM
    # (smaller than macos-latest), so the cold Rust build is ~2 min
    # slower. Revisit when GitHub rotates macos-26 to Safari 26.5 — if
    # the same regression appears there, fall back to a self-hosted
    # runner on a Mac whose local WebKit works.
    runs-on: macos-26
    needs: check-changes
    # Skip for docs-only PRs. On push/workflow_dispatch/workflow_call always run.
    # Branch protection note: job-level `if` skips produce a "skipped" status
    # which GitHub (post-2023 rules) treats as passing for required checks.
    # If branch protection was configured before 2023, open repo Settings →
    # Branches → edit the main rule → enable "Allow skipped" for this check.
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set whisper.cpp build flags
        run: |
          echo "CMAKE_C_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV

      - name: Create sidecar placeholder
        run: |
          mkdir -p src-tauri/binaries/lib
          touch src-tauri/binaries/llama-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/llama-server-aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache tauri-webdriver binary
        id: cache-tauri-webdriver
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/tauri-webdriver
          key: ${{ runner.os }}-tauri-webdriver-${{ hashFiles('**/Cargo.lock') }}

      - name: Install tauri-webdriver
        # The crate / binary name is `tauri-webdriver`, not `tauri-driver`
        # (some older Tauri docs use the latter). `scripts/run-real-e2e.sh`
        # looks for `tauri-webdriver` in PATH; install accordingly.
        if: steps.cache-tauri-webdriver.outputs.cache-hit != 'true'
        run: cargo install tauri-webdriver

      - name: Run real Tauri E2E tests
        run: pnpm test:e2e-real-full

      - name: Upload real-E2E logs on failure
        if: failure()
        # TODO: bump to actions/upload-artifact@v5 when available on Node 24 — https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-logs
          path: |
            /tmp/notesage-e2e-tauri.log
            /tmp/notesage-e2e-driver.log
          retention-days: 14
