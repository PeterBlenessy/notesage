name: Tests

on:
  push:
    branches: [main]   # post-merge regression catch + triggers real-E2E on main
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger from GitHub Actions UI
  workflow_call: # Allow release workflow to reuse these jobs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'e2e/**'
              - 'e2e-real/**'
              - 'bundled-skills/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'vitest.perf.config.ts'
              - 'playwright.config.ts'
              - 'wdio.conf.ts'
              - 'index.html'

  frontend-tests:
    name: Frontend Tests & Coverage
    # Linux: nothing here touches Apple. Vitest, tsc, the npm audit and the
    # contrast audit are all pure Node. macOS runners bill at a 10x multiplier
    # on private repos, and this is the single longest job in the workflow.
    runs-on: ubuntu-latest
    needs: check-changes
    # Skip for docs-only PRs. On push/workflow_dispatch/workflow_call always run.
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: npm dependency audit
        # Fails the job on a high/critical advisory in the npm tree (the Rust
        # tree is covered by the separate `cargo-audit` job). Tree confirmed
        # clean 2026-07-05 (docs/audits/2026-07-05-dependencies.md); overrides
        # in package.json hold the prior fixes. High threshold so a new moderate
        # doesn't block merge before it's triaged.
        # The registry's audit endpoint times out now and then (ERR_SOCKET_TIMEOUT
        # on 2026-09-03 blocked #877 with every test green). Three attempts,
        # spaced out; a real finding still fails on every attempt.
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --audit-level=high --prod; then exit 0; fi
            code=$?
            if [ "$attempt" -lt 3 ]; then echo "audit attempt $attempt failed (exit $code); retrying in 30s"; sleep 30; fi
          done
          exit 1

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Run contrast audit
        run: pnpm audit:contrast

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Test isolation (shuffled file order)
        # ADVISORY. Files run sequentially in one worker (`fileParallelism:
        # false`), so they share a module registry: a store one file mutates is
        # the SAME object in the next. Any test asserting on a "default" it did
        # not set is really asserting on what the previous file left behind, and
        # passes only because the fixed file order happens to be favourable.
        #
        # That is not hypothetical — two such tests failed intermittently and
        # blocked a PR (#735), and the cause looked like the innocent PR's fault
        # because the failing tests were unrelated to it.
        #
        # Shuffling FILES catches it at the commit that introduces it. Tests
        # within a file are deliberately NOT shuffled: their order is stable in
        # practice, and some files couple their tests on purpose (see
        # `useSkillOperations.test.ts`, where a module-level flag makes the first
        # test's run a precondition for the second).
        #
        # Advisory rather than blocking so a genuine cross-file bug shows up as
        # a signal to act on, not a red build on an unrelated PR — the same
        # reasoning as the perf step below. Promote to blocking once it has been
        # green for a while.
        continue-on-error: true
        run: pnpm vitest run --sequence.shuffle.files=true

      - name: Performance benchmarks
        id: perf
        # ADVISORY on TIMING (does not block merge/release). Wall-clock
        # benchmarks on a shared macos-latest runner have irreducible variance —
        # even after bumping the budget multiplier 3 → 4 → 5, the markdown-parse
        # 50KB case still spiked to ~1.5s under contention and blocked a release
        # on a pure timing flake (with no regression). Gating merges on
        # shared-runner wall-clock is unreliable, so this step runs + uploads
        # results but `continue-on-error` keeps a transient spike from failing
        # the build.
        # Real regression signal: local `pnpm test:perf` (multiplier 1x, strict)
        # and the separate post-merge "Real-App Performance Tracking" job.
        #
        # NOT advisory on whether the benchmarks RAN — see the guard step below.
        continue-on-error: true
        env:
          PERF_BUDGET_MULTIPLIER: "5"
        run: pnpm test:perf --reporter=json --outputFile=perf-report.json

      - name: Guard — benchmarks must actually run
        # `continue-on-error` above cannot tell "slower than budget" (noise on a
        # shared runner) from "threw before measuring anything" (a broken
        # benchmark with no perf coverage at all). This step draws that line and
        # fails ONLY on the second.
        #
        # 2026-08-22: three cmdbar benchmarks had been dying on mount with
        # `TypeError: useChatStore.subscribe is not a function` while CI stayed
        # green — the failure mode this exists to make impossible.
        #
        # `always()` so a failing earlier step cannot skip the guard and take
        # the signal with it — but NOT when the benchmarks were never given the
        # chance to run. A blocking step before them (typecheck, unit tests)
        # skips the perf step, leaving no report; reporting that as "benchmarks
        # did not run" is technically true and practically a red herring
        # stacked on the real failure. `outcome` is 'failure' rather than
        # 'skipped' when the perf step ran and exceeded budget, so the
        # continue-on-error case still reaches the guard.
        if: always() && steps.perf.outcome != 'skipped'
        run: node scripts/perf-ci-guard.mjs perf-report.json

      - name: Upload benchmark results
        if: always()
        # TODO: bump to actions/upload-artifact@v5 when available on Node 24 — https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          # The JSON report rides along so a guard failure can be diagnosed from
          # the artifact instead of re-reading the whole job log.
          path: |
            src/perf/
            perf-report.json
          retention-days: 14

      - name: Check coverage regression
        if: github.event_name == 'pull_request'
        run: pnpm coverage:check

      - name: Upload coverage report
        if: always()
        # TODO: bump to actions/upload-artifact@v5 when available on Node 24 — https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Post coverage summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          file-coverage-mode: none

  e2e-tests:
    name: Playwright E2E Tests
    # Linux: Playwright ships its OWN Chromium and WebKit builds on every
    # platform, so the webkit project runs identically here. The macOS runner
    # never provided Apple's WKWebView either — `playwright.config.ts` says so
    # itself, and points at e2e-real/ as the truth for the embedded webview.
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        env:
          # Honour the same perf-budget multiplier the Vitest perf harness uses
          # (`pnpm test:perf`). Shared CI runners pace setTimeout callbacks
          # slower than local AND share the machine with other jobs;
          # without the bump, `preview-fidelity.spec.ts`'s p95 timer-delay
          # assertion flakes in the 500–800 ms range against a 500 ms budget.
          PERF_BUDGET_MULTIPLIER: "3"
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        # TODO: bump to actions/upload-artifact@v5 when available on Node 24 — https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ios-swift-syntax:
    name: iOS Native Checks
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      # The iOS native sources are not part of any build this CI runs, so
      # without this job nothing would ever read them: a typo would surface
      # only at Xcode-integration time, on someone's laptop.
      #
      # Two tiers, because they are not equally checkable here:
      #
      #   LibraryAccess + LibraryCapture + ShareViewController  →  full
      #     -typecheck against the real iOS SDK with the capture bridging
      #     header. None of them import Tauri, so this is a genuine compile
      #     check: it resolves UIKit, the C ABI, and every call site.
      #     LibraryAccess comes from the plugin package because LibraryCapture
      #     extends it — the Share Extension target compiles both together.
      #
      #   NotesageIosPlugin  →  -parse only. It imports the `Tauri` Swift
      #     package, which only exists once Tauri wires the plugin's Swift
      #     Package into a generated Xcode project, so a type check would fail
      #     on the import rather than on the code.
      - name: Type-check iOS Swift sources
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.0 \
            -import-objc-header src-tauri/ios/NotesageCapture.h \
            src-tauri/crates/tauri-plugin-notesage-ios/ios/Sources/LibraryAccess.swift \
            src-tauri/ios/LibraryCapture.swift \
            src-tauri/ios/PageRenderer.swift \
            src-tauri/ios/ShareViewController.swift
          # The report web view and the chrome overlay import only UIKit /
          # WebKit / SwiftUI / Combine — no Tauri — so unlike the plugin they
          # can be genuinely type-checked here. Together, because
          # ReportWebView calls ChromeManager.
          #
          # Added with #606: ReportWebView.swift was landing in a job that
          # read every OTHER iOS Swift file, so a type error in the newest and
          # least-exercised native code was the one thing CI could not see.
          swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.0 \
            src-tauri/crates/tauri-plugin-notesage-ios/ios/Sources/ChromeOverlay.swift \
            src-tauri/crates/tauri-plugin-notesage-ios/ios/Sources/ReportWebView.swift
          swiftc -parse src-tauri/crates/tauri-plugin-notesage-ios/ios/Sources/NotesageIosPlugin.swift

      # The Share Extension links this static library to call the shared
      # capture-note formatter. Building it here proves the C ABI compiles for
      # the device target and exports the symbols Swift expects — the Xcode
      # integration step then only has to link it.
      - name: Build capture staticlib for iOS + verify exported symbols
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios \
            --manifest-path src-tauri/crates/notesage-capture/Cargo.toml
          LIB=src-tauri/target/aarch64-apple-ios/release/libnotesage_capture.a
          # Xcode's `nm` is older than the LLVM that rustc emits, so it errors
          # on the Rust std/dep objects in the archive ("Unknown attribute kind
          # (105)") and exits non-zero. Those objects are not what we are
          # checking — our own is readable — so capture the output and tolerate
          # the exit code, then assert on the symbols. Without the `|| true`,
          # `set -euo pipefail` kills the step before grep ever runs.
          syms="$(nm -gU "$LIB" 2>/dev/null || true)"
          [ -n "$syms" ] || { echo "nm produced no symbols at all — cannot verify the C ABI"; exit 1; }
          # Derived from the bridging header, not hardcoded. A fixed list only
          # ever checks the symbols someone remembered to add to it — and this
          # step passed for months while the X exports did not exist at all,
          # because none of the three named here were the missing ones.
          # Everything Swift can call is declared in the header, so the header
          # IS the list, and it cannot go stale.
          expected="$(grep -oE 'notesage_capture_[a-z_]+\(' src-tauri/ios/NotesageCapture.h \
                      | tr -d '(' | sort -u)"
          [ -n "$expected" ] || { echo "no exports found in NotesageCapture.h — parse failed"; exit 1; }
          echo "Checking $(printf '%s\n' "$expected" | wc -l | tr -d ' ') declared exports."
          # `while read` rather than `for name in $expected`: iterating an
          # unquoted variable relies on the shell's word-splitting rules, which
          # differ between shells and would silently treat the whole list as
          # one name.
          printf '%s\n' "$expected" | while IFS= read -r name; do
            [ -n "$name" ] || continue
            # `grep -q` exits on first match, which SIGPIPEs printf and — under
            # pipefail — fails the step precisely when the symbol IS found.
            # Plain grep with output discarded consumes all input instead.
            printf '%s\n' "$syms" | grep " T _$name\$" >/dev/null \
              || { echo "declared in NotesageCapture.h but NOT exported by the staticlib: $name"; exit 1; }
          done
          echo "All capture C ABI symbols exported."

  rust-tests:
    name: Rust Backend Tests
    runs-on: macos-latest
    needs: check-changes
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set whisper.cpp build flags
        run: |
          # Avoid i8mm intrinsic errors on CI clang (same fix as release workflow).
          # Metal GPU handles inference; CPU path needs only dotprod+fp16.
          echo "CMAKE_C_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV

      - name: Create sidecar placeholder
        run: |
          # Tauri build.rs validates externalBin paths exist.
          # The actual binary is too large to commit; create a placeholder for CI.
          mkdir -p src-tauri/binaries/lib
          touch src-tauri/binaries/llama-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/llama-server-aarch64-apple-darwin

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # Regression guard for the v0.46.0-alpha.17/18 startup crash: with
      # NOTESAGE_APTABASE_KEY set, the Aptabase plugin registers and its setup
      # hook calls tokio::spawn — which panics ("there is no reactor running")
      # unless run() enters a Tokio runtime first. Keyless test/dev builds never
      # register the plugin, so ONLY a key'd launch reproduces it. We build with
      # a dummy key and launch briefly, asserting the app gets past plugin setup
      # (reaches the "starting up" hook) without the reactor panic.
      - name: Smoke-launch with telemetry key (aptabase startup-panic regression)
        working-directory: src-tauri
        env:
          NOTESAGE_APTABASE_KEY: "A-DEV-0000000000"
        run: |
          cargo build --bin notesage
          BIN=target/debug/notesage
          echo "Launching $BIN for 20s to verify it survives plugin setup…"
          # The webview may fail to load in headless CI (no dev server) AFTER
          # plugin setup — that's fine; we only assert plugin init succeeds.
          "$BIN" > smoke.log 2>&1 &
          PID=$!
          sleep 20
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "----- smoke.log (tail) -----"
          tail -40 smoke.log || true
          echo "----------------------------"
          if grep -qi "there is no reactor running" smoke.log; then
            echo "::error::Startup panic from the telemetry plugin reproduced — run() must enter a Tokio runtime before the Tauri builder. See src-tauri/src/lib.rs build_app_runtime()."
            exit 1
          fi
          if ! grep -q "Notesage starting up" smoke.log; then
            echo "::error::App did not reach the 'starting up' setup hook within 20s with the telemetry plugin registered — startup is broken."
            exit 1
          fi
          echo "OK: app reached startup with the telemetry plugin registered; no reactor panic."

  cargo-audit:
    name: Rust Dependency Audit (advisory)
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'
    # Blocking as of 2026-07-05: the backend dependency tree was confirmed clean
    # (0 vulnerabilities — docs/audits/2026-07-05-dependencies.md), so this job
    # now fails on any RustSec *vulnerability*. `cargo audit` does NOT fail on
    # unmaintained/unsound *warnings* (currently 22, all deep-transitive gtk-rs
    # / typst), so flipping to blocking won't cause false reds — to also gate on
    # warnings later, add `[advisories] ignore = [...]` in src-tauri/audit.toml.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit

      # Some entries in src-tauri/.cargo/audit.toml are ignored because the
      # vulnerable crate is an unused optional feature that never compiles.
      # That claim is prose; this checks it is still true, so a dependency bump
      # cannot quietly switch the feature on while the advisory stays silenced.
      - name: Verify "never compiled" audit ignores still hold
        run: ./scripts/check-audit-ignore-claims.sh

  real-e2e-tests:
    name: Real Tauri E2E Tests
    # Pinned to `macos-26` (not `macos-latest`) to escape the Safari 26.5
    # regression that ships with `macos-15` image 20260520+ and breaks
    # the openFile → ProseMirror render path in WKWebView. macos-26 image
    # 20260520 is still on Safari 26.4 and runs the suite cleanly. See
    # issue #334. Tradeoff: macos-26 arm64 runner has 3 CPUs / 7 GB RAM
    # (smaller than macos-latest), so the cold Rust build is ~2 min
    # slower. Revisit when GitHub rotates macos-26 to Safari 26.5 — if
    # the same regression appears there, fall back to a self-hosted
    # runner on a Mac whose local WebKit works.
    runs-on: macos-26
    needs: check-changes
    # Skip for docs-only PRs. On push/workflow_dispatch/workflow_call always run.
    # Branch protection note: job-level `if` skips produce a "skipped" status
    # which GitHub (post-2023 rules) treats as passing for required checks.
    # If branch protection was configured before 2023, open repo Settings →
    # Branches → edit the main rule → enable "Allow skipped" for this check.
    if: needs.check-changes.outputs.code == 'true' || github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set whisper.cpp build flags
        run: |
          echo "CMAKE_C_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV
          echo "CMAKE_CXX_FLAGS=-march=armv8.2-a+dotprod+fp16" >> $GITHUB_ENV

      - name: Create sidecar placeholder
        run: |
          mkdir -p src-tauri/binaries/lib
          touch src-tauri/binaries/llama-server-aarch64-apple-darwin
          chmod +x src-tauri/binaries/llama-server-aarch64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache tauri-webdriver binary
        id: cache-tauri-webdriver
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/tauri-webdriver
          # Keyed on the PINNED driver version, not Cargo.lock: the lockfile has
          # nothing to do with which driver we want, and keying on it meant any
          # unrelated dependency change rotated this cache, missed, and
          # `cargo install` pulled whatever was newest. That is how #872 got
          # tauri-webdriver 0.2.0, which needs a `tauri:options.application`
          # capability this harness does not set, and every spec failed to
          # create a session. Bumping the version is now a deliberate edit
          # here, made together with the harness (#873).
          key: ${{ runner.os }}-tauri-webdriver-0.1.1

      - name: Install tauri-webdriver
        # The crate / binary name is `tauri-webdriver`, not `tauri-driver`
        # (some older Tauri docs use the latter). `scripts/run-real-e2e.sh`
        # looks for `tauri-webdriver` in PATH; install accordingly.
        if: steps.cache-tauri-webdriver.outputs.cache-hit != 'true'
        # --force: the binary can already exist even on a dedicated-cache miss
        # (a Cargo.lock change rotates this cache's key while the broader Rust
        # cache still restores ~/.cargo/bin), and cargo refuses to overwrite
        # without it ("binary `tauri-webdriver` already exists in destination").
        run: cargo install tauri-webdriver --version 0.1.1 --locked --force

      - name: Run real Tauri E2E tests
        run: pnpm test:e2e-real-full

      - name: Upload real-E2E logs on failure
        if: failure()
        # TODO: bump to actions/upload-artifact@v5 when available on Node 24 — https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-logs
          path: |
            /tmp/notesage-e2e-tauri.log
            /tmp/notesage-e2e-driver.log
          retention-days: 14
