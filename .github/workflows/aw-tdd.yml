name: AW — TDD

# Implements `tdd + afk` issues using the aw-tdd skill at
# .claude/skills/aw-tdd/SKILL.md. The cron sweep was consolidated into
# aw-sweep.yml; the issues.labeled trigger was also moved there. This
# standalone now exists ONLY as a workflow_dispatch entry point —
# used by aw-feedback after hitl→afk flip and for manual one-off
# re-implementation.
# The happy path runs from aw-pipeline.yml.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific issue number to implement (optional)"
        required: false

permissions:
  contents: write       # push branch
  pull-requests: write  # open draft PR
  issues: write         # update labels, post comments
  actions: write        # dispatch aw-review.yml after the PR is created
  id-token: write       # claude-code-action OIDC

concurrency:
  # Shared `aw-stage-{stage}-{issue}` group across all entry points — see
  # aw-triage.yml for the rationale (#98 cross-workflow race fix).
  group: aw-stage-tdd-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Use the fine-grained PAT so the agent can later push branches
          # — including .github/workflows/ edits, which GITHUB_TOKEN can't
          # touch. See "Choice: WORKFLOW_PAT for bot-PR CI gating" in
          # docs/agentic-workflow.md.
          token: ${{ secrets.WORKFLOW_PAT }}

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Precheck: find one eligible issue. Eligibility = `tdd` + `afk` +
      # `refined` + a category, AND not yet `review`. Event triggers
      # (issues.labeled) target the specific issue whose afk was added.
      - name: Find candidate
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.issue_number }}" ]]; then
            echo "candidate=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            # Event trigger: the if-guard already verified label.name == 'afk'
            # and actor is human. Verify the issue is fully eligible before
            # passing to the LLM step.
            ISSUE="${{ github.event.issue.number }}"
            LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name]')
            HAS_TDD=$(echo "$LABELS" | jq 'any(. == "tdd")')
            HAS_REFINED=$(echo "$LABELS" | jq 'any(. == "refined")')
            HAS_REVIEW=$(echo "$LABELS" | jq 'any(. == "review")')
            HAS_CATEGORY=$(echo "$LABELS" | jq 'any(. == "bug" or . == "enhancement" or . == "chore")')
            if [[ "$HAS_TDD" == "true" && "$HAS_REFINED" == "true" && "$HAS_CATEGORY" == "true" && "$HAS_REVIEW" != "true" ]]; then
              echo "candidate=$ISSUE" >> "$GITHUB_OUTPUT"
            else
              echo "Issue #$ISSUE not eligible (tdd=$HAS_TDD refined=$HAS_REFINED category=$HAS_CATEGORY review=$HAS_REVIEW). Skipping."
              echo "candidate=" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          ISSUE=$(gh issue list \
            --label tdd \
            --label afk \
            --label refined \
            --state open \
            --limit 10 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "review")) | not) | .number] | first(.[])? // empty')
          if [[ -z "$ISSUE" ]]; then
            echo "No eligible subtasks. Skipping LLM step."
            echo "candidate=" >> "$GITHUB_OUTPUT"
          else
            echo "Found candidate: #$ISSUE"
            echo "candidate=$ISSUE" >> "$GITHUB_OUTPUT"
          fi

      - name: Select model (escalate to Opus after 2 failures)
        if: steps.find.outputs.candidate != ''
        id: model_select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.find.outputs.candidate }}
        run: |
          set -euo pipefail
          ATTEMPTS=$(gh issue view "$ISSUE" --json comments \
            --jq '[.comments[] | select(.body | startswith("> *Starting implementation"))] | length')
          if [[ "$ATTEMPTS" -ge 2 ]]; then
            echo "model=claude-opus-4-7" >> "$GITHUB_OUTPUT"
            echo "TDD attempt $((ATTEMPTS+1)) — escalating to Opus"
          else
            echo "model=claude-sonnet-4-6" >> "$GITHUB_OUTPUT"
            echo "TDD attempt $((ATTEMPTS+1)) — using Sonnet"
          fi

      - name: Run aw-tdd skill
        if: steps.find.outputs.candidate != ''
        uses: anthropics/claude-code-action@v1
        with:
          model: ${{ steps.model_select.outputs.model }}   # sonnet default; escalates to opus after 2 failures
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the fine-grained PAT (WORKFLOW_PAT) instead of GITHUB_TOKEN
          # so the bot-authored PR fires `pull_request` events normally
          # — without it, the recursion guard suppresses `test.yml` and the
          # PR ends up with no CI checks. See "Choice: WORKFLOW_PAT for
          # bot-PR CI gating" in docs/agentic-workflow.md.
          github_token: ${{ secrets.WORKFLOW_PAT }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --max-turns 200
            --allowedTools "Bash,Edit,Write,Read,Grep,Glob"
          prompt: |
            Run the `aw-tdd` skill at `.claude/skills/aw-tdd/SKILL.md` on
            subtask #${{ steps.find.outputs.candidate }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            **Hard gates**: red tests must be RED before implementation; full
            `pnpm test` and `pnpm typecheck` must pass; only the files listed
            in the subtask body may be modified. Open the PR as DRAFT
            (`gh pr create --draft`). On any failure, re-add `afk` and post
            the failure comment.
