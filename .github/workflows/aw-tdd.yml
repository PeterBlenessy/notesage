name: AW — TDD

# Implements `tdd + afk` issues using the aw-tdd skill at
# .claude/skills/aw-tdd/SKILL.md. Standalone backstop: cron sweep +
# workflow_dispatch + label event (when a human flips hitl → afk,
# fire instantly instead of waiting up to 15 min for cron). The happy
# path runs from aw-pipeline.yml.

on:
  issues:
    types: [labeled]   # respond instantly to human-added afk
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific issue number to implement (optional)"
        required: false

permissions:
  contents: write       # push branch
  pull-requests: write  # open draft PR
  issues: write         # update labels, post comments
  id-token: write       # claude-code-action OIDC

concurrency:
  group: aw-tdd-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  code:
    # For issues.labeled events: only fire on human-added `afk` (the
    # hitl → afk flip). Bot-added labels mean the pipeline is processing
    # the issue — skip to avoid race. Cron + dispatch always fire.
    if: |
      github.event_name != 'issues' ||
      (github.actor != 'github-actions[bot]' && github.event.label.name == 'afk')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Precheck: find one eligible issue. Eligibility = `tdd` + `afk` +
      # `refined` + a category, AND not yet `review`. Event triggers
      # (issues.labeled) target the specific issue whose afk was added.
      - name: Find candidate
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.issue_number }}" ]]; then
            echo "candidate=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            # Event trigger: the if-guard already verified label.name == 'afk'
            # and actor is human. Verify the issue is fully eligible before
            # passing to the LLM step.
            ISSUE="${{ github.event.issue.number }}"
            LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name]')
            HAS_TDD=$(echo "$LABELS" | jq 'any(. == "tdd")')
            HAS_REFINED=$(echo "$LABELS" | jq 'any(. == "refined")')
            HAS_REVIEW=$(echo "$LABELS" | jq 'any(. == "review")')
            HAS_CATEGORY=$(echo "$LABELS" | jq 'any(. == "bug" or . == "enhancement" or . == "chore")')
            if [[ "$HAS_TDD" == "true" && "$HAS_REFINED" == "true" && "$HAS_CATEGORY" == "true" && "$HAS_REVIEW" != "true" ]]; then
              echo "candidate=$ISSUE" >> "$GITHUB_OUTPUT"
            else
              echo "Issue #$ISSUE not eligible (tdd=$HAS_TDD refined=$HAS_REFINED category=$HAS_CATEGORY review=$HAS_REVIEW). Skipping."
              echo "candidate=" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          ISSUE=$(gh issue list \
            --label tdd \
            --label afk \
            --label refined \
            --state open \
            --limit 10 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "review")) | not) | .number] | first(.[])? // empty')
          if [[ -z "$ISSUE" ]]; then
            echo "No eligible subtasks. Skipping LLM step."
            echo "candidate=" >> "$GITHUB_OUTPUT"
          else
            echo "Found candidate: #$ISSUE"
            echo "candidate=$ISSUE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run aw-tdd skill
        if: steps.find.outputs.candidate != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See aw-pipeline.yml for the rationale.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --max-turns 200
            --allowedTools "Bash,Edit,Write,Read,Grep,Glob"
          prompt: |
            Run the `aw-tdd` skill at `.claude/skills/aw-tdd/SKILL.md` on
            subtask #${{ steps.find.outputs.candidate }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            **Hard gates**: red tests must be RED before implementation; full
            `pnpm test` and `pnpm typecheck` must pass; only the files listed
            in the subtask body may be modified. Open the PR as DRAFT
            (`gh pr create --draft`). On any failure, re-add `afk` and post
            the failure comment.
