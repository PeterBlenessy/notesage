name: AW — Slice

# Decides whether a refined issue ships as one PR or as N peer issues
# using the aw-slice skill at .claude/skills/aw-slice/SKILL.md. The
# cron sweep was consolidated into aw-sweep.yml; the issues.labeled
# trigger was also moved there. This standalone now exists ONLY as a
# workflow_dispatch entry point — used by aw-feedback after a label
# flip and for manual one-off re-slicing.
# The happy path runs from aw-pipeline.yml.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific issue number to slice (optional)"
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  # Shared `aw-stage-{stage}-{issue}` group across all entry points — see
  # aw-triage.yml for the rationale (#98 cross-workflow race fix).
  group: aw-stage-slice-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Precheck: act on issues with `refined` + `slice` AND not yet
      # `sliced` or `awaiting-research`. Category label (bug/enhancement/
      # chore) is required as a sanity check that triage ran.
      - name: Find candidates
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.issue_number }}" ]]; then
            echo "candidates=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            ISSUE="${{ github.event.issue.number }}"
            LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name]')
            HAS_CATEGORY=$(echo "$LABELS" | jq 'any(. == "bug" or . == "enhancement" or . == "chore")')
            HAS_REFINED=$(echo "$LABELS" | jq 'any(. == "refined")')
            HAS_SLICE=$(echo "$LABELS" | jq 'any(. == "slice")')
            HAS_SLICED=$(echo "$LABELS" | jq 'any(. == "sliced")')
            HAS_AWAITING=$(echo "$LABELS" | jq 'any(. == "awaiting-research")')
            if [[ "$HAS_CATEGORY" != "true" ]] || [[ "$HAS_REFINED" != "true" ]] || [[ "$HAS_SLICE" != "true" ]] || [[ "$HAS_SLICED" == "true" ]] || [[ "$HAS_AWAITING" == "true" ]]; then
              echo "Issue #$ISSUE not eligible. Skipping."
              echo "candidates=" >> "$GITHUB_OUTPUT"
            else
              echo "candidates=$ISSUE" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          ISSUES=$(gh issue list \
            --label slice \
            --label refined \
            --state open \
            --limit 5 \
            --json number,labels \
            --jq '[.[] | select(([.labels[].name] | any(. == "sliced" or . == "awaiting-research")) | not) | .number] | first(.[])? // empty')
          if [[ -z "$ISSUES" ]]; then
            echo "No slicing candidates. Skipping LLM step."
            echo "candidates=" >> "$GITHUB_OUTPUT"
          else
            echo "Found candidate: #$ISSUES"
            echo "candidates=$ISSUES" >> "$GITHUB_OUTPUT"
          fi

      - name: Run aw-slice skill
        if: steps.find.outputs.candidates != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # See aw-pipeline.yml for the rationale.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions[bot]"
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(gh:*),Read"
          prompt: |
            Run the `aw-slice` skill at `.claude/skills/aw-slice/SKILL.md`
            on issue #${{ steps.find.outputs.candidates }} in this repository
            (PeterBlenessy/notesage). Read the skill in full and follow it
            precisely.

            **Hard constraints** (also defined in the skill):
            - Default to NOT slicing. One user value = one PR; most issues
              pass directly to aw-tdd as a single PR (mark `tdd + (afk|hitl)`,
              remove `slice`).
            - Slice ONLY when the issue delivers N independent user values,
              each independently shippable. Then: rewrite the original issue
              body to be the FIRST peer slice; create N-1 NEW peer issues
              with `Split from #<original>` in their body. NO GraphQL
              parent/child link. NO `feature` label.
            - Each peer carries the parent's category + `refined` + `tdd` +
              exactly one of `hitl` / `afk`.
            - If under-specified, create ONE research peer issue only and
              set the original to `awaiting-research` (and remove `slice`).
            - Idempotent: if `sliced` or `awaiting-research` already set,
              exit silently.
