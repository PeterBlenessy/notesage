name: Model-fit calibration data
description: Voluntarily contribute your hardware/model performance measurements to improve Notesage's local-AI recommendations.
title: "Calibration data: <chip>"
labels: ["calibration-data"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing calibration data! These measurements help us tune the speed and memory constants that drive Notesage's local-AI model recommendations, so everyone gets better hardware-fit suggestions.

        **Please read before submitting — this is NOT anonymous.** This issue is **public** and is permanently associated with your GitHub handle. The auto-filled payload contains **only**:

        - your hardware specs (chip, RAM),
        - the model names you ran,
        - two performance numbers (measured tokens/second and peak RAM).

        It contains **no document content and no personal data**. If you are not comfortable publishing the above under your GitHub identity, please close this form without submitting.
  - type: textarea
    id: data
    attributes:
      label: Measurement data
      description: Auto-filled by Notesage — please don't edit
      render: text
    validations:
      required: true
  - type: input
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Optional context — e.g. thermal conditions, background load, power source.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This data was generated by Notesage and contains no personal information.
          required: true
