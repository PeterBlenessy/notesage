<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Tauri + React + Typescript</title>
    <style>
      /* Immediate background color before any JS/CSS loads — prevents white flash.
         Uses prefers-color-scheme as a best-effort match for the app theme.
         Colors match oklch values in globals.css: dark oklch(18% 0 0), light oklch(100% 0 0). */
      html, body { background-color: #fff; }
      @media (prefers-color-scheme: dark) {
        html, body { background-color: #121211; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
