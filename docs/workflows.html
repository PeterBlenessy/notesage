<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notesage Workflows</title>
  <style>
    :root {
      --bg: oklch(98% 0 0);
      --surface: oklch(100% 0 0);
      --surface-2: oklch(96% 0 0);
      --fg: oklch(18% 0 0);
      --fg-muted: oklch(45% 0 0);
      --fg-subtle: oklch(60% 0 0);
      --border: oklch(90% 0 0);
      --border-strong: oklch(80% 0 0);
      --accent: oklch(56% 0.16 253);
      --accent-soft: oklch(56% 0.16 253 / 0.12);
      --shadow: 0 1px 2px oklch(0% 0 0 / 0.04), 0 4px 12px oklch(0% 0 0 / 0.04);
    }
    html.dark {
      --bg: oklch(15% 0 0);
      --surface: oklch(20% 0 0);
      --surface-2: oklch(24% 0 0);
      --fg: oklch(96% 0 0);
      --fg-muted: oklch(70% 0 0);
      --fg-subtle: oklch(55% 0 0);
      --border: oklch(28% 0 0);
      --border-strong: oklch(38% 0 0);
      --accent: oklch(70% 0.14 253);
      --accent-soft: oklch(70% 0.14 253 / 0.18);
      --shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 4px 12px oklch(0% 0 0 / 0.3);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      flex: 0 0 auto;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }
    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    header .meta {
      font-size: 11px;
      color: var(--fg-muted);
      margin-left: 12px;
    }
    header .actions { display: flex; gap: 8px; align-items: center; }
    button.tool-btn {
      font: inherit;
      font-size: 11px;
      padding: 4px 10px;
      background: var(--surface-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 120ms ease;
    }
    button.tool-btn:hover { background: var(--border); }

    main {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }
    aside#flow-list {
      flex: 0 0 280px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--surface);
      padding: 12px 0;
    }
    aside#flow-list h2 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-subtle);
      font-weight: 600;
      margin: 8px 16px 4px;
    }
    .flow-item {
      display: block;
      padding: 8px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 80ms ease, border-color 80ms ease;
      user-select: none;
    }
    .flow-item:hover { background: var(--surface-2); }
    .flow-item.active {
      background: var(--accent-soft);
      border-left-color: var(--accent);
    }
    .flow-item .flow-title {
      font-weight: 500;
      font-size: 12.5px;
      color: var(--fg);
      margin-bottom: 2px;
    }
    .flow-item .flow-step-count {
      font-size: 10.5px;
      color: var(--fg-subtle);
    }

    section#diagram-area {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    #flow-header {
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    #flow-header h2 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    #flow-header p {
      margin: 0;
      font-size: 12px;
      color: var(--fg-muted);
      max-width: 1200px;
    }

    #diagram-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      background: var(--bg);
    }
    #diagram {
      display: block;
      width: 100%;
      min-width: 1280px;
    }
    #diagram .node-box {
      transition: opacity 180ms ease, filter 180ms ease;
    }
    #diagram .node-box.dimmed { opacity: 0.22; }
    #diagram .node-box.in-flow .node-rect { stroke-width: 2.5; }
    #diagram .node-box .node-label {
      font-size: 12px;
      font-weight: 600;
      fill: var(--fg);
      pointer-events: none;
    }
    #diagram .node-box .node-subtitle {
      font-size: 9.5px;
      fill: var(--fg-muted);
      pointer-events: none;
    }
    html.dark #diagram .node-box .node-label,
    html.dark #diagram .node-box .node-subtitle {
      /* fill above gives correct light/dark via CSS vars */
    }
    #diagram .edge {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.6;
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
    }
    #diagram .edge.visible { opacity: 1; }
    #diagram .edge.hover { stroke-width: 2.6; }
    #diagram .edge-num-bg {
      fill: var(--accent);
      stroke: var(--surface);
      stroke-width: 1.5;
      opacity: 0;
      transition: opacity 220ms ease;
    }
    #diagram .edge-num-bg.visible { opacity: 1; }
    #diagram .edge-num {
      font-size: 9.5px;
      font-weight: 700;
      fill: white;
      text-anchor: middle;
      dominant-baseline: central;
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
      user-select: none;
    }
    #diagram .edge-num.visible { opacity: 1; }

    #steps {
      flex: 0 0 auto;
      max-height: 280px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 20px 16px;
    }
    #steps h3 {
      margin: 0 0 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg-subtle);
      font-weight: 600;
    }
    .step {
      display: flex;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: default;
      transition: background 80ms ease;
    }
    .step:hover { background: var(--surface-2); }
    .step.active { background: var(--accent-soft); }
    .step .step-num {
      flex: 0 0 22px;
      height: 22px;
      border-radius: 11px;
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .step .step-body { flex: 1 1 auto; min-width: 0; }
    .step .step-route {
      font-size: 12px;
      font-weight: 500;
    }
    .step .step-route .arrow {
      color: var(--fg-subtle);
      margin: 0 6px;
    }
    .step .step-route .label {
      color: var(--accent);
      font-weight: 600;
      margin-left: 6px;
    }
    .step .step-detail {
      font-size: 11.5px;
      color: var(--fg-muted);
      margin-top: 2px;
    }

    #legend {
      flex: 0 0 auto;
      display: flex;
      gap: 14px;
      padding: 8px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--fg-muted);
    }
    #legend .swatch {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    #legend .swatch-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid var(--border-strong);
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--fg-muted);
    }
    code {
      font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
      font-size: 11px;
      background: var(--surface-2);
      padding: 1px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:baseline;">
      <h1>Notesage Workflows</h1>
      <span class="meta">Click a flow to highlight the path · Hover a step to focus a single edge</span>
    </div>
    <div class="actions">
      <button class="tool-btn" id="theme-toggle">Toggle theme</button>
    </div>
  </header>

  <main>
    <aside id="flow-list">
      <h2>Flows</h2>
      <div id="flow-list-items"></div>
    </aside>

    <section id="diagram-area">
      <div id="flow-header">
        <h2 id="flow-title">Loading…</h2>
        <p id="flow-summary"></p>
      </div>

      <div id="diagram-wrap">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div id="steps">
        <h3>Steps</h3>
        <div id="steps-list"></div>
      </div>

      <div id="legend"></div>
    </section>
  </main>

  "flows": [
    {
      "id": "save-file",
      "title": "Save a file (Cmd+S)",
      "summary": "Persists the active document to disk, suppresses the resulting watcher event, and triggers a SQLite reindex of the changed file.",
      "steps": [
        {
          "from": "editor",
          "to": "editor-ext",
          "label": "serialize doc",
          "detail": "ProseMirror doc \u2192 markdown via prosemirror-markdown serializer in src/lib/markdown.ts"
        },
        {
          "from": "editor-ext",
          "to": "hooks",
          "label": "saveFile(path, text)",
          "detail": "useFileOperations.saveFile() called from editor's Cmd+S handler"
        },
        {
          "from": "hooks",
          "to": "tauri-ipc",
          "label": "invoke('mark_self_write')",
          "detail": "Records the path in WatcherState.self_writes with a 5s TTL so the upcoming watcher event is suppressed"
        },
        {
          "from": "hooks",
          "to": "tauri-ipc",
          "label": "invoke('write_file')",
          "detail": "After mark_self_write resolves; writes UTF-8 bytes"
        },
        {
          "from": "tauri-ipc",
          "to": "file-cmds",
          "label": "write_file(path, content)",
          "detail": "commands/file.rs writes the file via std::fs"
        },
        {
          "from": "file-cmds",
          "to": "filesystem",
          "label": "fs::write",
          "detail": "Real disk write; macOS FSEvents queues a Modify event"
        },
        {
          "from": "filesystem",
          "to": "watcher",
          "label": "FSEvents \u2192 notify",
          "detail": "notify_debouncer_full coalesces within 500ms; classified as Modify"
        },
        {
          "from": "watcher",
          "to": "sqlite-index",
          "label": "queue reindex",
          "detail": "Self-writes are still indexed (only the frontend file-changed-batch event is suppressed)"
        },
        {
          "from": "watcher",
          "to": "tauri-ipc",
          "label": "(suppressed)",
          "detail": "is_self_write() returns true so no file-changed-batch event fires for this path"
        },
        {
          "from": "hooks",
          "to": "stores",
          "label": "mark tab clean",
          "detail": "editor-store.markClean(tabId); savedAt timestamp updated, 'saved Xs ago' chrome refreshes"
        }
      ]
    },
    {

      "title": "Open a file from the sidebar",

        {
          "from": "sidebar",
          "to": "hooks",
          "label": "click row",
          "detail": "FileTreeItem onActivate \u2192 useFileOperations.openFile(path)"
        },
        {
          "from": "hooks",
          "to": "stores",
          "label": "lookup tab",
          "detail": "editor-store.openDocuments scanned for existing tab; if found, just activate"
        },
        {
          "from": "hooks",
          "to": "tauri-ipc",
          "label": "invoke('read_file')",
          "detail": "Only invoked on cache miss; routes by extension (markdown vs binary viewer)"
        },
        {
          "from": "tauri-ipc",
          "to": "file-cmds",
          "label": "read_file(path)",
          "detail": "commands/file.rs returns Ok(String) for UTF-8, Err otherwise"
        },
        {
          "from": "file-cmds",
          "to": "filesystem",
          "label": "fs::read_to_string",
          "detail": "Reads bytes; cloud paths gated by 10s per-step timeout in startup wrapper"
        },
        {
          "from": "hooks",
          "to": "stores",
          "label": "addTab + setActive",
          "detail": "editor-store.openDocuments updated with new entry; activeTabId set"
        },
        {
          "from": "stores",
          "to": "editor",
          "label": "render active tab",
          "detail": "Editor.tsx subscribes to activeTabId; effect triggers content load"
        },
        {
          "from": "editor",
          "to": "editor-ext",
          "label": "loadRawMarkdownIntoEditor",
          "detail": "Parses markdown \u2192 ProseMirror doc; logs [perf:doc-load] and [perf:setContent]"
        }
      ]
    },
    {
      "id": "startup-restore",
      "title": "Open project + restore tabs (startup)",
      "summary": "App boot flow: validates persisted workspace state, refreshes file trees, restores open tabs, initializes the SQLite index, and starts watchers.",
      "steps": [
        {
          "from": "shell",
          "to": "hooks",
          "label": "App mount \u2192 useAppLifecycle",
          "detail": "Single 30s global timeout + 10s per-step timeouts so cloud paths can't hang startup"
        },

          "from": "hooks",
          "to": "stores",

        },

          "from": "hooks",
          "to": "tauri-ipc",

        },

          "from": "tauri-ipc",
          "to": "file-cmds",

          "from": "file-cmds",

  <script>
    (function () {
      const NODE_W = 180;
      const NODE_H = 58;

      const themeToggle = document.getElementById("theme-toggle");
      const flowListEl = document.getElementById("flow-list-items");
      const flowTitle = document.getElementById("flow-title");
      const flowSummary = document.getElementById("flow-summary");
      const stepsList = document.getElementById("steps-list");
      const legendEl = document.getElementById("legend");
      const svg = document.getElementById("diagram");

      // Theme
      const stored = localStorage.getItem("notesage-workflows-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (stored === "dark" || (!stored && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
      themeToggle.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        localStorage.setItem(
          "notesage-workflows-theme",
          document.documentElement.classList.contains("dark") ? "dark" : "light"
        );
      });

      function loadData() {
        return fetch("./workflows.json", { cache: "no-store" })
          .then((r) => {
            if (!r.ok) throw new Error("fetch failed: " + r.status);
            return r.json();
          })
          .catch(() => {
            const raw = document.getElementById("workflows-data-fallback").textContent;
            try {
              return JSON.parse(raw);
            } catch (e) {
              throw new Error("Inline fallback JSON is malformed: " + e.message);
            }
          });
      }

      function init(data) {
        const nodesById = Object.fromEntries(data.nodes.map((n) => [n.id, n]));
        const categories = data.categories || {};
        const canvas = data.canvas || { width: 1380, height: 900 };

        // Compute SVG height from node positions (with bottom padding)
        const maxY = Math.max(...data.nodes.map((n) => n.y + NODE_H)) + 30;
        const height = Math.max(canvas.height, maxY);
        svg.setAttribute("viewBox", `0 0 ${canvas.width} ${height}`);
        svg.setAttribute("height", height);

        // <defs> for arrowhead marker
        const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
        defs.innerHTML = `
          <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        `;
        svg.appendChild(defs);

        // Render nodes
        const nodeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
        nodeLayer.setAttribute("id", "node-layer");
        svg.appendChild(nodeLayer);

        const nodeEls = {};
        for (const node of data.nodes) {
          const cat = categories[node.category] || {};
          const isDark = document.documentElement.classList.contains("dark");
          const fill = cat.fill || "#eee";
          const darkFill = cat.darkFill || "#333";
          const stroke = cat.stroke || "#888";

          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.setAttribute("class", "node-box");
          g.setAttribute("data-node-id", node.id);
          g.setAttribute("transform", `translate(${node.x}, ${node.y})`);

          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("class", "node-rect");
          rect.setAttribute("width", NODE_W);
          rect.setAttribute("height", NODE_H);
          rect.setAttribute("rx", 8);
          rect.setAttribute("ry", 8);
          rect.setAttribute("fill", fill);
          rect.setAttribute("data-light-fill", fill);
          rect.setAttribute("data-dark-fill", darkFill);
          rect.setAttribute("stroke", stroke);
          rect.setAttribute("stroke-width", 1);
          g.appendChild(rect);

          const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
          label.setAttribute("class", "node-label");
          label.setAttribute("x", 12);
          label.setAttribute("y", 22);
          label.textContent = node.label;
          g.appendChild(label);

          if (node.subtitle) {
            const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
            sub.setAttribute("class", "node-subtitle");
            sub.setAttribute("x", 12);
            sub.setAttribute("y", 40);
            sub.textContent = node.subtitle.length > 36 ? node.subtitle.slice(0, 35) + "…" : node.subtitle;
            const titleEl = document.createElementNS("http://www.w3.org/2000/svg", "title");
            titleEl.textContent = node.subtitle;
            g.appendChild(titleEl);
            g.appendChild(sub);
          }

          nodeLayer.appendChild(g);
          nodeEls[node.id] = g;
        }

        // Apply dark fills if needed
        applyThemeFills();

        // Edge layer (above nodes so arrows are visible)
        const edgeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
        edgeLayer.setAttribute("id", "edge-layer");
        svg.appendChild(edgeLayer);

        // Edge labels layer
        const labelLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
        labelLayer.setAttribute("id", "label-layer");
        svg.appendChild(labelLayer);

        // Render flow list
        for (const flow of data.flows) {
          const item = document.createElement("div");
          item.className = "flow-item";
          item.dataset.flowId = flow.id;
          item.innerHTML = `
            <div class="flow-title"></div>
            <div class="flow-step-count"></div>
          `;
          item.querySelector(".flow-title").textContent = flow.title;
          item.querySelector(".flow-step-count").textContent = `${flow.steps.length} steps`;
          item.addEventListener("click", () => selectFlow(flow.id));
          flowListEl.appendChild(item);
        }

        // Render legend
        for (const [key, cat] of Object.entries(categories)) {
          const sw = document.createElement("span");
          sw.className = "swatch";
          sw.innerHTML = `<span class="swatch-color" data-cat="${key}"></span>${cat.label}`;
          legendEl.appendChild(sw);
        }
        applyLegendFills();

        // Reactive theme application
        const observer = new MutationObserver(() => {
          applyThemeFills();
          applyLegendFills();
        });
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

        // Auto-select first flow
        if (data.flows.length) selectFlow(data.flows[0].id);

        // ---------- Helpers ----------

        function applyThemeFills() {
          const isDark = document.documentElement.classList.contains("dark");
          for (const rect of svg.querySelectorAll(".node-rect")) {
            rect.setAttribute("fill", isDark ? rect.dataset.darkFill : rect.dataset.lightFill);
          }
        }

        function applyLegendFills() {
          const isDark = document.documentElement.classList.contains("dark");
          for (const el of legendEl.querySelectorAll(".swatch-color")) {
            const cat = categories[el.dataset.cat];
            if (cat) el.style.background = isDark ? cat.darkFill : cat.fill;
          }
        }

        function nodeAnchor(node, otherCenterX, otherCenterY) {
          const cx = node.x + NODE_W / 2;
          const cy = node.y + NODE_H / 2;
          const dx = otherCenterX - cx;
          const dy = otherCenterY - cy;
          // Pick the side closest to other node center; favour horizontal connections
          if (Math.abs(dx) * 0.7 > Math.abs(dy)) {
            return dx >= 0
              ? { x: node.x + NODE_W, y: cy, side: "right" }
              : { x: node.x,           y: cy, side: "left" };
          }
          return dy >= 0
            ? { x: cx, y: node.y + NODE_H, side: "bottom" }
            : { x: cx, y: node.y,           side: "top" };
        }

        function bezierPath(s, t) {
          // Self-loop
          if (s.x === t.x && s.y === t.y) {
            const r = 22;
            return `M ${s.x} ${s.y} c ${r} ${-r}, ${r * 2} ${-r}, ${r * 2} 0 c 0 ${r}, ${-r} ${r}, ${-r * 2} 0 z`;
          }
          const dx = t.x - s.x;
          const dy = t.y - s.y;
          // Control offset based on side
          const sOff = s.side === "right" ? 1 : s.side === "left" ? -1 : 0;
          const tOff = t.side === "right" ? 1 : t.side === "left" ? -1 : 0;
          const sVOff = s.side === "bottom" ? 1 : s.side === "top" ? -1 : 0;
          const tVOff = t.side === "bottom" ? 1 : t.side === "top" ? -1 : 0;
          const mag = Math.max(40, Math.min(200, Math.abs(dx) * 0.45 + Math.abs(dy) * 0.25));
          const c1x = s.x + sOff * mag + sVOff * 0;
          const c1y = s.y + sVOff * mag;
          const c2x = t.x + tOff * mag;
          const c2y = t.y + tVOff * mag;
          return `M ${s.x} ${s.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${t.x} ${t.y}`;
        }

        function bezierMidpoint(s, t) {
          // Approximate midpoint of cubic curve (t = 0.5)
          const dx = t.x - s.x;
          const dy = t.y - s.y;
          const sOff = s.side === "right" ? 1 : s.side === "left" ? -1 : 0;
          const tOff = t.side === "right" ? 1 : t.side === "left" ? -1 : 0;
          const sVOff = s.side === "bottom" ? 1 : s.side === "top" ? -1 : 0;
          const tVOff = t.side === "bottom" ? 1 : t.side === "top" ? -1 : 0;
          const mag = Math.max(40, Math.min(200, Math.abs(dx) * 0.45 + Math.abs(dy) * 0.25));
          const c1x = s.x + sOff * mag;
          const c1y = s.y + sVOff * mag;
          const c2x = t.x + tOff * mag;
          const c2y = t.y + tVOff * mag;
          // Cubic Bezier B(0.5)
          const t05 = 0.5;
          const omt = 1 - t05;
          const x = omt ** 3 * s.x + 3 * omt ** 2 * t05 * c1x + 3 * omt * t05 ** 2 * c2x + t05 ** 3 * t.x;
          const y = omt ** 3 * s.y + 3 * omt ** 2 * t05 * c1y + 3 * omt * t05 ** 2 * c2y + t05 ** 3 * t.y;
          return { x, y };
        }

        let activeFlowId = null;
        let edgeEls = []; // [{ pathEl, numBg, numText, stepIdx }]

        function clearEdges() {
          while (edgeLayer.firstChild) edgeLayer.removeChild(edgeLayer.firstChild);
          while (labelLayer.firstChild) labelLayer.removeChild(labelLayer.firstChild);
          edgeEls = [];
        }

        function selectFlow(flowId) {
          const flow = data.flows.find((f) => f.id === flowId);
          if (!flow) return;
          activeFlowId = flowId;

          // Update sidebar selection
          for (const el of flowListEl.querySelectorAll(".flow-item")) {
            el.classList.toggle("active", el.dataset.flowId === flowId);
          }

          // Update header
          flowTitle.textContent = flow.title;
          flowSummary.textContent = flow.summary || "";

          // Determine which nodes are in this flow
          const flowNodeIds = new Set();
          for (const step of flow.steps) {
            flowNodeIds.add(step.from);
            flowNodeIds.add(step.to);
          }

          // Dim non-flow nodes
          for (const [id, el] of Object.entries(nodeEls)) {
            el.classList.toggle("dimmed", !flowNodeIds.has(id));
            el.classList.toggle("in-flow", flowNodeIds.has(id));
          }

          // Render edges
          clearEdges();
          flow.steps.forEach((step, idx) => {
            const sNode = nodesById[step.from];
            const tNode = nodesById[step.to];
            if (!sNode || !tNode) {
              console.warn(`Flow ${flow.id} step ${idx + 1}: unknown node`, step);
              return;
            }
            const sCenter = { x: sNode.x + NODE_W / 2, y: sNode.y + NODE_H / 2 };
            const tCenter = { x: tNode.x + NODE_W / 2, y: tNode.y + NODE_H / 2 };
            const sAnchor = nodeAnchor(sNode, tCenter.x, tCenter.y);
            const tAnchor = nodeAnchor(tNode, sCenter.x, sCenter.y);

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("class", "edge");
            path.setAttribute("d", bezierPath(sAnchor, tAnchor));
            path.setAttribute("marker-end", "url(#arrowhead)");
            path.setAttribute("color", "var(--accent)"); // for marker currentColor
            path.style.color = "var(--accent)";
            edgeLayer.appendChild(path);

            const mid = bezierMidpoint(sAnchor, tAnchor);
            const numBg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            numBg.setAttribute("class", "edge-num-bg");
            numBg.setAttribute("cx", mid.x);
            numBg.setAttribute("cy", mid.y);
            numBg.setAttribute("r", 11);
            labelLayer.appendChild(numBg);

            const numText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            numText.setAttribute("class", "edge-num");
            numText.setAttribute("x", mid.x);
            numText.setAttribute("y", mid.y);
            numText.textContent = String(idx + 1);
            labelLayer.appendChild(numText);

            edgeEls.push({ pathEl: path, numBg, numText, stepIdx: idx });

            // Stagger reveal slightly so the path animates in order
            setTimeout(() => {
              path.classList.add("visible");
              numBg.classList.add("visible");
              numText.classList.add("visible");
            }, 30 * idx);
          });

          // Render steps panel
          stepsList.innerHTML = "";
          flow.steps.forEach((step, idx) => {
            const sNode = nodesById[step.from];
            const tNode = nodesById[step.to];
            const stepEl = document.createElement("div");
            stepEl.className = "step";
            stepEl.dataset.stepIdx = String(idx);
            stepEl.innerHTML = `
              <div class="step-num">${idx + 1}</div>
              <div class="step-body">
                <div class="step-route">
                  <span class="from"></span>
                  <span class="arrow">→</span>
                  <span class="to"></span>
                  <span class="label"></span>
                </div>
                <div class="step-detail"></div>
              </div>
            `;
            stepEl.querySelector(".from").textContent = sNode ? sNode.label : step.from;
            stepEl.querySelector(".to").textContent = tNode ? tNode.label : step.to;
            stepEl.querySelector(".label").textContent = step.label || "";
            stepEl.querySelector(".step-detail").textContent = step.detail || "";
            stepEl.addEventListener("mouseenter", () => focusStep(idx));
            stepEl.addEventListener("mouseleave", () => focusStep(null));
            stepsList.appendChild(stepEl);
          });
        }

        function focusStep(idx) {
          for (const el of stepsList.querySelectorAll(".step")) {
            el.classList.toggle("active", Number(el.dataset.stepIdx) === idx);
          }
          for (const e of edgeEls) {
            const isHover = idx === null ? false : e.stepIdx === idx;
            const isDim = idx !== null && e.stepIdx !== idx;
            e.pathEl.classList.toggle("hover", isHover);
            e.pathEl.style.opacity = idx === null ? "" : isDim ? "0.18" : "1";
            e.numBg.style.opacity = idx === null ? "" : isDim ? "0.18" : "1";
            e.numText.style.opacity = idx === null ? "" : isDim ? "0.18" : "1";
          }
        }
      }

      loadData()
        .then(init)
        .catch((err) => {
          flowTitle.textContent = "Failed to load workflows";
          flowSummary.innerHTML = `<code>${err.message}</code>`;
          console.error(err);
        });
    })();
  </script>
