[package]
name = "notesage"
version = "0.1.0"
description = "Notesage - A WYSIWYG markdown editor with AI collaboration"
authors = ["Peter Blenessy"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "fs"] }
futures = "0.3"
bytes = "1"
dirs = "5"
tauri-plugin-window-state = "2.4.1"

# PDF export (Phase 4)
typst = "0.14.2"
typst-pdf = "0.14.2"
typst-syntax = "0.14.2"
typst-library = "0.14.2"
typst-utils = "0.14.2"
chrono = { version = "0.4", default-features = false, features = ["now", "clock"] }
comrak = { version = "0.50.0", default-features = false, features = ["syntect"] }

# Tag scanning
regex = "1"

# SQLite document index (Phase 10)
rusqlite = { version = "0.34", features = ["bundled"] }
sha2 = "0.10"

# Skills & Agents Platform (Phase 7)
serde_yml = "0.0.12"

# Filesystem watcher (Phase 5)
notify = { version = "7", features = ["macos_fsevent"] }
notify-debouncer-full = "0.4"

# iCloud sync (Phase 5.5)
fs_extra = "1.3"
libc = "0.2"

# ACP - Agent Client Protocol (Phase 6)
agent-client-protocol = "0.9"
agent-client-protocol-schema = "0.10"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }

# Logging
tauri-plugin-log = "2"
log = "0.4"

# Auto-update
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2.5.7"

# System info (local AI memory detection)
sysinfo = "0.35"

# Local AI binary download (zip extraction)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Voice transcription
whisper-rs = "0.15"
cpal = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.15", features = ["metal"] }

[dev-dependencies]
tempfile = "3"

