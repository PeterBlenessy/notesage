[package]
name = "notesage"
version = "0.1.0"
description = "Notesage - A WYSIWYG markdown editor with AI collaboration"
authors = ["Peter Blenessy"]
license = "MIT"
edition = "2021"


# `notesage-capture` is a workspace member so it lands in `cargo test` — the
# one implementation of the capture-note format stays covered by the same gate
# as everything else.
#
# It is ALSO an iOS-only dependency of the app binary (below). It was
# deliberately not linked at all when captures were written solely by the
# Share Extension, which links the staticlib directly. Self-contained articles
# changed that: the image sweep runs in the APP, and it needs the same pure
# `article_image_urls` / `inline_article_images` the extension's format uses.
# Sharing the crate rather than reimplementing is the point — two parsers for
# one document format is how they drift.
#
# Still iOS-only, so desktop builds link nothing new.
[workspace]
members = ["crates/notesage-capture", "crates/tauri-plugin-notesage-ios"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
flate2 = "1"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "fs"] }
futures = "0.3"
bytes = "1"
dirs = "5"
tauri-plugin-window-state = "2.4.1"

# PDF export (Phase 4)
typst = "0.14.2"
typst-pdf = "0.14.2"
typst-syntax = "0.14.2"
# SVG text-to-paths pre-processing and rasterization for DOCX/PPTX export
usvg = "0.45"
fontdb = "0.23"
resvg = "0.45"
chrono = { version = "0.4", default-features = false, features = ["now", "clock"] }
comrak = { version = "0.52.0", default-features = false, features = ["syntect"] }

# Tag scanning
regex = "1"

# SQLite document index (Phase 10)
rusqlite = { version = "0.39", features = ["bundled"] }
sha2 = "0.10"

# Skills & Agents Platform (Phase 7)
serde_norway = "0.9"

# Automations — 5-field standard cron parsing + next-time (chrono-native)
saffron = "0.1"

# Non-poisoning mutexes (replaces std::sync::Mutex for index + watcher)
parking_lot = "0.12"

# Filesystem watcher (Phase 5)
notify = { version = "7", features = ["macos_fsevent"] }
notify-debouncer-full = "0.4"

# iCloud sync (Phase 5.5)
fs_extra = "1.3"
libc = "0.2"

# ACP - Agent Client Protocol (Phase 6)
# Upstream repo moved to github.com/agentclientprotocol/rust-sdk.
# Stabilized in 0.13.x/0.14.0 (feature flags removed, functionality is default):
# session usage updates, ContentChunk.message_id (replaces the old
# PromptRequest.message_id design). The session-model API was removed entirely —
# model selection now goes through config options with category "model".
# agent-client-protocol 0.14.0 pins the schema crate to exactly =0.13.6, so the
# two versions must move together.
# `unstable_end_turn_token_usage` gates `PromptResponse.usage` (per-turn token
# breakdown, provider-usage-display #1). UNSTABLE upstream — the field
# deserializes DefaultOnError so a shape change degrades to `None`, never a
# prompt failure; consumption in acp.rs is strictly best-effort.
agent-client-protocol = { version = "0.14.0", features = ["unstable_session_fork", "unstable_auth_methods", "unstable_end_turn_token_usage"] }
agent-client-protocol-schema = { version = "=0.13.6", features = ["unstable_session_fork", "unstable_auth_methods", "unstable_end_turn_token_usage"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Logging
tauri-plugin-log = "2"
log = "0.4"

# Auto-update
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-http = "2"
# Used by `commands::alpha_update` to construct UpdaterBuilder endpoints
# and format release dates (matches what tauri-plugin-updater depends on).
url = "2"
time = { version = "0.3", features = ["formatting"] }

# System info (local AI memory detection)
sysinfo = "0.35"

# Local AI binary download (zip extraction)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Network sandboxing proxy (Phase 2)
uuid = { version = "1", features = ["v4"] }

# Secure credential storage (OS keychain)
keyring = { version = "3", features = ["apple-native"] }

# URL encoding/decoding (web search)
urlencoding = "2"

# System font enumeration
font-kit = "0.14"

# System tray, notifications, autostart (Phase 13)
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"

# HTML parsing for link preview metadata extraction
scraper = "0.27"

# PPTX export
ppt-rs = "0.2"

# DOCX export
docx-rs = "0.4"

# Voice transcription — desktop only; see the non-iOS target table below.

# E2E testing (optional — only enabled via `--features e2e-testing`)
tauri-plugin-webdriver = { version = "0.2", optional = true }
tauri-plugin-deep-link = "2.4.9"
# Only for installing the process-default CryptoProvider at startup — reqwest
# 0.13's rustls path panics "No provider set" without one. Ring is already in
# the tree transitively; this makes it explicit and selectable.
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Telemetry — privacy-first usage analytics (first-party Tauri v2 plugin).
# NOT available on iOS: the plugin's `sys.rs` leaves `ENGINE_NAME` undefined
# for that target, so it fails to compile there. Gated off rather than patched
# because the mobile app ships no usage telemetry by design (PRD
# `2026-06-28-ios-mobile-app.md` § Non-Goals) — there is nothing to lose.
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-notesage-ios = { path = "crates/tauri-plugin-notesage-ios" }
notesage-capture = { path = "crates/notesage-capture" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri-plugin-aptabase = "1.0.0"
# Telemetry — crash/error reporting (Sentry, DSN-swappable to GlitchTip).
# Desktop-only, like aptabase above: the iOS binary must not even LINK the
# telemetry SDKs — that absence is what backs the App Store privacy label
# "Data Not Collected" (#587), regression-locked by
# `telemetry_crates_are_gated_off_the_ios_target`.
# Pin to match tauri-plugin-sentry 0.5's internal sentry version (0.42) so the
# ClientInitGuard passed to the plugin is the same type — a newer top-level
# sentry pulls a second major into the tree and breaks `init(&client)`.
sentry = "0.42"
tauri-plugin-sentry = "0.5.0"
# `whisper-rs` vendors whisper.cpp, whose ggml kernels reference Accelerate
# symbols (`_vDSP_vsub`, `cblas_*`) that fail to link on iOS; `cpal` drives
# microphone capture. Mobile ships no recording or transcription (PRD § Non-
# Goals), so both stay off rather than being dead weight in a read-only reader.
whisper-rs = "0.16"
cpal = "0.17"
# Audio decoding for transcription (#803). Codecs are opt-in, so this compiles
# only the containers a shared or recorded file can actually arrive in — the
# `all-codecs` feature would pull in video and subtitle decoders we never call.
#
# Deliberately NOT AVFoundation as the primary: `transcription.rs` carries no
# `target_os` gate today, and decoding an MP3 is not a platform-specific
# capability the way Seatbelt or the NSColor bridge are. A pure-Rust decoder
# also stays testable as a function over bytes.
#
# MPL-2.0: file-level copyleft, obligations attach to symphonia's own sources
# and not to what links them. Already precedented here — `option-ext` and
# `selectors` are both MPL-2.0 in Cargo.lock.
symphonia = { version = "0.6", default-features = false, features = [
    "wav", "pcm", "mp3", "aac", "alac", "isomp4", "flac", "ogg", "vorbis", "aiff", "caf",
] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# AppKit bridge for NSColor.controlAccentColor (system accent color picker option)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSpace"] }
# CoreAudio fallback for files symphonia cannot decode (#803). Two known gaps
# it covers: Opus in an .ogg container (symphonia ships `vorbis`, not Opus),
# and any AAC its decoder rejects that Apple accepts. Failure path only — it
# never runs when symphonia succeeds.
objc2-avf-audio = { version = "0.3", features = ["AVAudioFile", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSError"] }

[features]
default = []
e2e-testing = ["tauri-plugin-webdriver"]

[dev-dependencies]
tempfile = "3"
# Test-only: a real DST timezone for the cron wall-clock / resolve_wallclock tests.
chrono-tz = "0.10"

