[package]
name = "notesage"
version = "0.1.0"
description = "Notesage - A WYSIWYG markdown editor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
dirs = "5"
tauri-plugin-window-state = "2.4.1"

# PDF export (Phase 4)
typst = "0.14.2"
typst-pdf = "0.14.2"
typst-syntax = "0.14.2"
typst-library = "0.14.2"
typst-utils = "0.14.2"
chrono = { version = "0.4", default-features = false, features = ["now", "clock"] }
comrak = { version = "0.50.0", default-features = false, features = ["syntect"] }

# Filesystem watcher (Phase 5)
notify = { version = "7", features = ["macos_fsevent"] }
notify-debouncer-full = "0.4"

