# cargo-audit configuration for the CI "Rust Dependency Audit" job
# (test.yml runs `cargo audit` with working-directory src-tauri, so this is
# $PWD/.cargo/audit.toml — the path cargo-audit reads).
#
# Every entry below is a vulnerability whose FIX VERSION is semver-unreachable
# until an upstream dependency moves — verified with `cargo tree -i` per
# crate. Each is documented with its blocker and tracked in an issue; remove
# an entry as soon as the upstream bump lands. New advisories still fail CI.

[advisories]
ignore = [
    # rkyv 0.7.46 (OOB reads validating archives with Rc/Arc; fix >=0.8.17).
    # In the lockfile only as an UNUSED optional feature of rust_decimal
    # (via typst-library / byte-unit) — no rkyv code is compiled. Issue #589.
    "RUSTSEC-2026-0235",

    # quick-xml (fix >=0.41.0): quadratic duplicate-attribute check.
    # Pinned by docx-rs 0.4 (0.36) and typst's citation stack
    # citationberg/hayagriva (0.38); both parse app-local/trusted XML, and
    # the impact is DoS-shaped, not memory corruption. Issue #602.
    "RUSTSEC-2026-0194",
    # quick-xml NsReader unbounded namespace allocation (same pins as above).
    "RUSTSEC-2026-0195",

    # bincode 1.3.3 "unmaintained": pinned by syntect 5 (comrak / ppt-rs),
    # used only to load BUNDLED syntax-highlighting definitions — trusted
    # input packaged at build time. Waiting on syntect → bincode 2. Issue #602.
    "RUSTSEC-2025-0141",
]
